<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Bastion 盾牌图标">
  <defs>
    <linearGradient id="shield" x1="30" y1="26" x2="78" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FB0F2"/>
      <stop offset="0.55" stop-color="#1E6FC0"/>
      <stop offset="1" stop-color="#0A2A4D"/>
    </linearGradient>
    <radialGradient id="key" cx="52" cy="47" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEFC4"/>
      <stop offset="0.55" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#B9760F"/>
    </radialGradient>
    <radialGradient id="key2" cx="52" cy="60" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE6A8"/>
      <stop offset="0.55" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#B9760F"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <path d="M54 28 L80 38 L80 56 Q80 75 54 88 Q28 75 28 56 L28 38 Z" fill="#08233F" fill-opacity="0.16"/>
  <!-- shield body -->
  <path d="M54 26 L80 36 L80 56 Q80 74 54 86 Q28 74 28 56 L28 36 Z" fill="url(#shield)"/>
  <!-- top highlight -->
  <path d="M54 26 L80 36 L80 47 Q54 41 28 47 L28 36 Z" fill="#FFFFFF" fill-opacity="0.20"/>
  <!-- rim light -->
  <path d="M54 26 L80 36 L80 56 Q80 74 54 86 Q28 74 28 56 L28 36 Z" fill="none" stroke="#9FD4FF" stroke-opacity="0.85" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- keyhole circle (SVG supports <circle>) -->
  <circle cx="54" cy="50" r="8.5" fill="url(#key)"/>
  <!-- keyhole shackle -->
  <path d="M49 57 L59 57 L63 72 L45 72 Z" fill="url(#key2)"/>
  <!-- keyhole specular -->
  <ellipse cx="51.8" cy="46.5" rx="2.6" ry="1.8" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>
