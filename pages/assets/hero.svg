<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Bastion 保险库核心">
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2E7CC8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#1E5FA8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1E5FA8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F5B942" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="120" y1="90" x2="300" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FD4FF"/>
      <stop offset="0.5" stop-color="#2E7FC8"/>
      <stop offset="1" stop-color="#0A2A4D"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#FFF0CC"/>
      <stop offset="0.5" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#B9760F"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="60" x2="0" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5B942" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>

    <!-- 单根光射线 -->
    <path id="ray" d="M204 60 L210 5 L216 60 Z" fill="url(#ray)"/>
    <!-- 库门外环刻度 -->
    <line id="tick" x1="210" y1="46" x2="210" y2="60" stroke="#9FD4FF" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 径向辐条 -->
    <line id="spoke" x1="210" y1="152" x2="210" y2="104" stroke="#9FD4FF" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
  </defs>

  <!-- 背后蓝色光晕 -->
  <circle cx="210" cy="210" r="200" fill="url(#blueGlow)" filter="url(#soft)"/>

  <!-- 光射线（12 根） -->
  <g>
    <use href="#ray"/>
    <use href="#ray" transform="rotate(30 210 210)"/>
    <use href="#ray" transform="rotate(60 210 210)"/>
    <use href="#ray" transform="rotate(90 210 210)"/>
    <use href="#ray" transform="rotate(120 210 210)"/>
    <use href="#ray" transform="rotate(150 210 210)"/>
    <use href="#ray" transform="rotate(180 210 210)"/>
    <use href="#ray" transform="rotate(210 210 210)"/>
    <use href="#ray" transform="rotate(240 210 210)"/>
    <use href="#ray" transform="rotate(270 210 210)"/>
    <use href="#ray" transform="rotate(300 210 210)"/>
    <use href="#ray" transform="rotate(330 210 210)"/>
  </g>

  <!-- 金色轨道环 -->
  <circle cx="210" cy="210" r="178" fill="none" stroke="#F5B942" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="2 22"/>
  <circle cx="392" cy="392" r="5" fill="#F5B942"/>
  <circle cx="392" cy="392" r="10" fill="#F5B942" fill-opacity="0.25"/>

  <!-- 库门外环（金属渐变 + 刻度） -->
  <circle cx="210" cy="210" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="20"/>
  <g>
    <use href="#tick"/>
    <use href="#tick" transform="rotate(15 210 210)"/>
    <use href="#tick" transform="rotate(30 210 210)"/>
    <use href="#tick" transform="rotate(45 210 210)"/>
    <use href="#tick" transform="rotate(60 210 210)"/>
    <use href="#tick" transform="rotate(75 210 210)"/>
    <use href="#tick" transform="rotate(90 210 210)"/>
    <use href="#tick" transform="rotate(105 210 210)"/>
    <use href="#tick" transform="rotate(120 210 210)"/>
    <use href="#tick" transform="rotate(135 210 210)"/>
    <use href="#tick" transform="rotate(150 210 210)"/>
    <use href="#tick" transform="rotate(165 210 210)"/>
    <use href="#tick" transform="rotate(180 210 210)"/>
    <use href="#tick" transform="rotate(195 210 210)"/>
    <use href="#tick" transform="rotate(210 210 210)"/>
    <use href="#tick" transform="rotate(225 210 210)"/>
    <use href="#tick" transform="rotate(240 210 210)"/>
    <use href="#tick" transform="rotate(255 210 210)"/>
    <use href="#tick" transform="rotate(270 210 210)"/>
    <use href="#tick" transform="rotate(285 210 210)"/>
    <use href="#tick" transform="rotate(300 210 210)"/>
    <use href="#tick" transform="rotate(315 210 210)"/>
    <use href="#tick" transform="rotate(330 210 210)"/>
    <use href="#tick" transform="rotate(345 210 210)"/>
  </g>

  <!-- 内环 + 径向辐条 -->
  <circle cx="210" cy="210" r="112" fill="none" stroke="#9FD4FF" stroke-opacity="0.30" stroke-width="2"/>
  <g>
    <use href="#spoke"/>
    <use href="#spoke" transform="rotate(30 210 210)"/>
    <use href="#spoke" transform="rotate(60 210 210)"/>
    <use href="#spoke" transform="rotate(90 210 210)"/>
    <use href="#spoke" transform="rotate(120 210 210)"/>
    <use href="#spoke" transform="rotate(150 210 210)"/>
    <use href="#spoke" transform="rotate(180 210 210)"/>
    <use href="#spoke" transform="rotate(210 210 210)"/>
    <use href="#spoke" transform="rotate(240 210 210)"/>
    <use href="#spoke" transform="rotate(270 210 210)"/>
    <use href="#spoke" transform="rotate(300 210 210)"/>
    <use href="#spoke" transform="rotate(330 210 210)"/>
  </g>

  <!-- 金色内核 -->
  <circle cx="210" cy="210" r="74" fill="url(#coreGlow)" filter="url(#soft)"/>
  <circle cx="210" cy="210" r="50" fill="url(#core)" stroke="#C98A1E" stroke-width="1.5"/>
  <circle cx="210" cy="202" r="12" fill="#0A2A4D"/>
  <path d="M204 209 L216 209 L219 234 L201 234 Z" fill="#0A2A4D"/>
  <ellipse cx="200" cy="197" rx="5" ry="3.4" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
