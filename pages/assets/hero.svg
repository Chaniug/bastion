<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Bastion fortress shield with golden keyhole">
  <title>Bastion fortress shield with golden keyhole</title>
  <defs>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B942" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#F5B942" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#9FD4FF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#4A82C4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B2E52" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BFE4FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9FD4FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5E9BD6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE6A8"/>
      <stop offset="48%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#B9760F"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- 几何堡垒：顶部 4 垛 + 收腰 + 尖底。中心 (200,190) -->
    <path id="keep" d="M 128 130
      L 139 130 L 139 110 L 157 110 L 157 130
      L 172 130 L 172 108 L 190 108 L 190 130
      L 210 130 L 210 108 L 228 108 L 228 130
      L 243 130 L 243 110 L 261 110 L 261 130
      L 272 130 L 272 152 L 259 166 L 259 216
      C 259 250 235 276 200 292
      C 165 276 141 250 141 216
      L 141 166 L 128 152 Z"/>
  </defs>

  <rect width="400" height="400" fill="none"/>
  <ellipse cx="200" cy="190" rx="180" ry="170" fill="url(#h)"/>
  <circle cx="200" cy="190" r="156" fill="none" stroke="#9FD4FF" stroke-opacity="0.13" stroke-width="1.5"/>
  <circle cx="200" cy="190" r="176" fill="none" stroke="#F5B942" stroke-opacity="0.18"
          stroke-width="1" stroke-dasharray="3 12" stroke-linecap="round"/>

  <g>
    <use href="#keep" fill="none" stroke="#9FD4FF" stroke-opacity="0.35" stroke-width="6" filter="url(#glow)"/>
    <use href="#keep" fill="url(#g)"/>
    <use href="#keep" fill="none" stroke="url(#e)" stroke-width="2.5" stroke-linejoin="round"/>
    <use href="#keep" fill="url(#s)"/>
  </g>

  <g filter="url(#glow)" opacity="0.6">
    <circle cx="200" cy="177" r="14" fill="#F5B942"/>
    <path d="M 190 183 L 210 183 L 213 212 L 187 212 Z" fill="#F5B942"/>
  </g>
  <g>
    <circle cx="200" cy="177" r="14" fill="url(#go)"/>
    <path d="M 190 183 L 210 183 L 213 212 L 187 212 Z" fill="url(#go)"/>
    <circle cx="200" cy="177" r="14" fill="none" stroke="#7A4E07" stroke-opacity="0.35" stroke-width="1"/>
  </g>
</svg>
