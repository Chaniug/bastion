name: Deploy Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Allow this job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs, keep the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The static site lives in the `pages/` directory.
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
