name: Android Preview Build

on:
  # 说明：main / dev 推送的预览包现统一由 main.yml（Android CI debug）流水线产出并发布到 preview Release。
  # 本流水线不再随 push 自动跑 release 构建（main 合入可省约 11 分钟/次），避免与 CI debug 重复构建同一 preview Release。
  # - pull_request：仅做 Debug 构建校验，不发布（所有发布步骤均 if: != 'pull_request' 护着）。
  # - workflow_dispatch：手动触发，构建 Release 预览包并发布到 preview Release。
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'Bastion/**/*.kt'
      - 'Bastion/**/*.java'
      - 'Bastion/**/*.xml'
      - 'Bastion/**/*.gradle'
      - 'Bastion/**/*.kts'
      - 'Bastion/gradle/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-release
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build & Publish Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "Bastion"
    env:
      # 启用 Gradle 构建缓存与并行，缩短重复构建耗时
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Validate signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          missing=0
          for name in DEBUG_KEYSTORE_BASE64 DEBUG_STORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing signing secret::$name is empty or unavailable."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "::error title=Keystore decode failed::release.jks was not created or is empty."
            exit 1
          fi
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Verify keystore credentials
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/release.jks" \
            -storepass "${{ secrets.DEBUG_STORE_PASSWORD }}" \
            -alias "${{ secrets.DEBUG_KEY_ALIAS }}" >/dev/null
          echo "Keystore, password, and alias validated successfully."
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Generate preview version suffix
        id: preview_meta
        shell: bash
        run: |
          suffix="build.$(date -u +%Y%m%d%H%M)"
          echo "PREVIEW_VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "preview_version_suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK for PR validation
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug --stacktrace -PpreviewVersionSuffix=$PREVIEW_VERSION_SUFFIX

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            --build-cache \
            --stacktrace \
            -PpreviewMinify=false \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.DEBUG_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.DEBUG_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.DEBUG_KEY_PASSWORD }} \
            -PpreviewVersionSuffix=$PREVIEW_VERSION_SUFFIX
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Stop Gradle Daemon
        if: always()
        shell: bash
        run: ./gradlew --stop || true

      - name: Diagnostics - cache & environment
        if: always()
        shell: bash
        run: |
          echo "=== Gradle wrapper / cache diagnostics ==="
          ./gradlew --version 2>/dev/null || true
          echo "--- Gradle cache sizes ---"
          du -sh "$HOME/.gradle/caches" 2>/dev/null || true
          du -sh "$HOME/.gradle/caches/build-cache-1" 2>/dev/null || true
          du -sh "$HOME/.gradle/configuration-cache" 2>/dev/null || true
          echo "--- Java version ---"
          java -version 2>&1 || true

      - name: Collect generated APK metadata
        id: preview_apk_meta
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cd app/build/outputs/apk/release

          apk_list="$(find . -maxdepth 1 -type f \( -iname '*.apk' \) -printf '%f\n' | sort)"
          apk_count="$(printf '%s\n' "$apk_list" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$apk_count" = "0" ]; then
            echo "No release APK found"
            ls -la
            exit 1
          fi

          apk_markdown="$(printf '%s\n' "$apk_list" | sed '/^$/d' | sed 's/^/> *   `/; s/$/`/')"

          echo "Detected release APKs:"
          printf '%s\n' "$apk_list" | sed '/^$/d' | sed 's/^/ - /'
          echo "PREVIEW_APK_COUNT=${apk_count}" >> "$GITHUB_ENV"
          echo "preview_apk_count=${apk_count}" >> "$GITHUB_OUTPUT"
          {
            echo "preview_apk_list<<EOF"
            printf '%s\n' "$apk_markdown"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Preview APK artifact (fallback)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-apk
          path: Bastion/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Self-test changelog generator
        if: github.event_name != 'pull_request'
        shell: bash
        run: python3 "${{ github.workspace }}/scripts/generate_changelog.py" --self-test

      - name: Generate preview changelog (since last preview)
        id: preview_changelog
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          prev="$(gh api "repos/${{ github.repository }}/releases/tags/preview" --jq '.target_commitish' 2>/dev/null || true)"
          notes="$(python3 "${{ github.workspace }}/scripts/generate_changelog.py" --prev "$prev" --head HEAD --repo "${{ github.workspace }}")"
          if [ -z "$notes" ]; then notes="- 无变更记录"; fi
          { echo "notes<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Cleanup duplicate preview draft releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          draft_ids=$(gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.tag_name == "preview" and .draft == true) | .id')
          if [ -z "$draft_ids" ]; then
            echo "No duplicate preview draft releases to clean"
            exit 0
          fi

          while IFS= read -r release_id; do
            [ -z "$release_id" ] && continue
            echo "Deleting duplicate preview draft release id=${release_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/${release_id}
          done <<< "$draft_ids"

      - name: Cleanup previous preview release assets
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_id="$(gh api repos/${{ github.repository }}/releases/tags/preview --jq '.id' 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            echo "No existing preview release assets to clean"
            exit 0
          fi

          asset_ids="$(gh api repos/${{ github.repository }}/releases/${release_id}/assets --paginate --jq '.[].id')"
          if [ -z "$asset_ids" ]; then
            echo "Preview release has no existing assets"
            exit 0
          fi

          while IFS= read -r asset_id; do
            [ -z "$asset_id" ] && continue
            echo "Deleting previous preview asset id=${asset_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/${asset_id}
          done <<< "$asset_ids"

      - name: Publish Preview to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: "⚠️ Development Preview (${{ steps.preview_meta.outputs.preview_version_suffix }})"
          body: |
            > **⚠️ 注意：这是一个自动构建的开发预览版本 (Development Preview)**
            > 
            > 此版本用于快速体验最新代码，可能包含未完成的功能或 Bug。
            > 正式使用请下载下面的 Stable 版本。
            > 但是实际上 Stable 版本可能不如这个预览版本更新，毕竟 Stable 版本需要经过更多的测试和验证。
            > 预览版本可能会更快地包含最新的功能和修复，但也可能更不稳定。
            > ---
            > **更新内容 (What's Changed):**
            > ${{ steps.preview_changelog.outputs.notes }}
            > ---
            > **构建信息：**
            > *   **Build Suffix**: `${{ steps.preview_meta.outputs.preview_version_suffix }}`
            > *   **Generated APK Count**: `${{ steps.preview_apk_meta.outputs.preview_apk_count }}`
            > **Generated APKs:**
            ${{ steps.preview_apk_meta.outputs.preview_apk_list }}
            > *   **Commit SHA**: `${{ github.sha }}`
            > *   **Ref**: `${{ github.ref }}`
          files: |
            Bastion/app/build/outputs/apk/release/*.apk
            Bastion/app/build/outputs/apk/release/*.APK
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
