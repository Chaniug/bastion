name: Desktop Build

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'desktop/**'
      - '.github/workflows/Desktop-*.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
      # 强制 en-US locale：jpackage 在 zh-CN 区域下生成 MSI 会因 WiX 本地化失败（light.exe exit 216）
      JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install WiX toolset (for MSI packaging)
        shell: powershell
        run: |
          choco install wixtoolset -y --no-progress

      - name: Compile shared module
        run: ./gradlew :shared:compileKotlinJvm --stacktrace

      - name: Package Windows app
        run: ./gradlew :desktop:packageMsi --stacktrace

      - name: Stop Gradle Daemon
        if: always()
        shell: bash
        run: ./gradlew --stop || true

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: bastion-desktop-msi
          path: desktop/desktop/build/compose/binaries/main/msi/**/*.msi
          if-no-files-found: warn
