name: Desktop Build & Release

on:
  # push 到 main/dev 仅做构建校验（编译 + 打包验证），不发布 Release
  push:
    branches: [ main, dev ]
    paths:
      - 'desktop/**'
      - '.github/workflows/Desktop-*.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'desktop/**'
  # 手动触发：构建并发布 Windows 桌面版 Release
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (no v prefix), e.g. 0.1.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      # 禁用 Gradle 构建缓存：代码频繁变更，build cache 会恢复旧代码产物导致编译失败
      # （依赖缓存仍由 setup-gradle 保留，只关任务输出缓存）
      GRADLE_OPTS: -Dorg.gradle.caching=false -Dorg.gradle.parallel=true
      # 强制 en-US locale：jpackage 在 zh-CN 区域下生成 MSI 会因 WiX 本地化失败（light.exe exit 216）
      JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install WiX toolset (for MSI packaging)
        shell: powershell
        run: |
          choco install wixtoolset -y --no-progress

      - name: Compile shared module
        run: ./gradlew :shared:compileKotlinJvm --no-build-cache --stacktrace

      - name: Package Windows app (MSI + EXE)
        shell: bash
        run: |
          # 仅 workflow_dispatch 时把 Release 版本注入安装包版本号（BastionDesktop-<version>.msi/.exe），
          # 与 Release 标签保持一致；push/PR 校验构建则保持 build.gradle.kts 默认版本。
          PKG_VERSION="${{ github.event.inputs.version }}"
          EXTRA=()
          if [ -n "$PKG_VERSION" ]; then EXTRA+=("-Pbastion.packageVersion=$PKG_VERSION"); fi
          ./gradlew :desktop:packageMsi :desktop:packageExe --no-build-cache --stacktrace "${EXTRA[@]}"

      - name: Verify bundled JRE & launch smoke test
        shell: bash
        run: |
          # 防止发布“缺少内置 JRE”的安装包：安装后若 runtime 目录缺失/损坏，
          # jpackage 启动器会直接报 "Failed to launch JVM / JVM 未安装" 类错误。
          APP_EXE=$(find desktop/build/compose/binaries/main/app -maxdepth 4 -name 'BastionDesktop.exe' | head -1)
          if [ -z "$APP_EXE" ]; then
            echo "::error::BastionDesktop.exe not found in app image"; exit 1
          fi
          RT="$(dirname "$APP_EXE")/runtime"
          if [ ! -f "$RT/bin/server/jvm.dll" ]; then
            echo "::error::bundled JRE missing: $RT/bin/server/jvm.dll"; exit 1
          fi
          grep -q '^JAVA_VERSION=' "$RT/release" || { echo "::error::invalid runtime release file"; exit 1; }
          echo "Bundled JRE OK: $(grep '^JAVA_VERSION=' "$RT/release") ($APP_EXE)"
          # 启动冒烟测试：启动器 + JVM 必须能拉起应用并保持运行，否则视为启动失败。
          "$APP_EXE" & PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "Smoke test OK: app alive after 15s"
            taskkill //PID "$PID" //T //F >/dev/null 2>&1 || true
          else
            echo "::error::app exited during smoke test (launcher/JVM startup failure)"
            exit 1
          fi

      - name: Stop Gradle Daemon
        if: always()
        shell: bash
        run: ./gradlew --stop || true

      - name: Collect packaging metadata
        id: meta_files
        shell: bash
        run: |
          echo "=== Generated binaries ==="
          find desktop/build/compose/binaries/main -type f | sort
          {
            echo "msi_files<<EOF"
            find desktop/build/compose/binaries/main/msi -name '*.msi' | sed 's/^/> *   `/' 
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "exe_files<<EOF"
            find desktop/build/compose/binaries/main/exe -name '*.exe' | sed 's/^/> *   `/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload installers artifact
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: bastion-desktop-installers
          path: |
            desktop/desktop/build/compose/binaries/main/msi/**/*.msi
            desktop/desktop/build/compose/binaries/main/exe/**/*.exe
          if-no-files-found: warn

      - name: Resolve release version & tag
        if: github.event_name == 'workflow_dispatch'
        id: meta
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          tag="v${version}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate changelog since last release
        if: github.event_name == 'workflow_dispatch'
        id: changelog
        shell: bash
        run: |
          set +e
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            notes="- 首次桌面端 Release"
          else
            notes="$(git log --oneline --no-merges ${prev}..HEAD -- desktop/ | head -50)"
            if [ -z "$notes" ]; then notes="- 无变更记录"; fi
          fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${prev:-none}"

      - name: Remove existing release/tag for this version (idempotent re-run)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          tag="${{ steps.meta.outputs.tag }}"
          rid="$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.id' 2>/dev/null)"
          if [[ "$rid" =~ ^[0-9]+$ ]]; then
            echo "Deleting existing release id=${rid} for tag ${tag}"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${rid}" 2>/dev/null
          fi
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null
          true

      - name: Publish Windows Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Bastion Desktop v${{ steps.meta.outputs.version }}"
          body: |
            > **Windows 桌面客户端 (Desktop)**
            >
            > Bastion 密码管理器桌面版：Bitwarden 条目同步 / 本地 KDBX 编辑 / KDBX→OneDrive 同步。
            >
            > **注意：** 当前为早期预览版本，仅支持骨架功能，核心同步能力逐步接入中。
            > ---
            > **构建信息：**
            > * **Version**: `${{ steps.meta.outputs.version }}`
            > * **Commit**: `${{ github.sha }}`
            >
            > **下载安装（任选一种）：**
            > * **EXE 安装版**：双击安装，自动写入开始菜单
            > * **MSI 安装版**：双击安装，支持企业部署/组策略
            > * 说明：EXE 比 MSI 略小（约 5%），两者都内置 JRE 17 运行时，**无需预装 Java**。
            >
            > **遇到 "Failed to launch JVM / 未找到 JVM" 提示怎么办？**
            > * 该提示来自应用启动器，仅表示安装目录下的 `runtime`（内置 JRE）缺失或损坏，**不是**要求你手动安装 Java。
            > * 常见原因：旧版本未完全卸载、安装被安全软件拦截/隔离、或安装包与已安装版本同名冲突（提示 1638）。
            > * 处理：先卸载旧版 → 重启 → 放行杀毒软件（或将 `D:\Program Files\BastionDesktop` / `C:\Program Files\BastionDesktop` 加入白名单）→ 重新安装本版本。
            >
            > ## 更新内容 (What's Changed)
            > ${{ steps.changelog.outputs.notes }}
          files: |
            desktop/desktop/build/compose/binaries/main/msi/**/*.msi
            desktop/desktop/build/compose/binaries/main/exe/**/*.exe
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
