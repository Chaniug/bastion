name: Android CI debug

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'Bastion/**/*.kt'
      - 'Bastion/**/*.java'
      - 'Bastion/**/*.xml'
      - 'Bastion/**/*.gradle'
      - 'Bastion/**/*.gradle.kts'
      - 'Bastion/**/*.kts'
      - 'Bastion/gradle/**'
      - 'Bastion/gradlew'
      - 'Bastion/gradlew.bat'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'Bastion/**/*.kt'
      - 'Bastion/**/*.java'
      - 'Bastion/**/*.xml'
      - 'Bastion/**/*.gradle'
      - 'Bastion/**/*.gradle.kts'
      - 'Bastion/**/*.kts'
      - 'Bastion/gradle/**'
      - 'Bastion/gradlew'
      - 'Bastion/gradlew.bat'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: Lint, test diagnostics, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "Bastion"
    env:
      # 启用 Gradle 构建缓存 + 并行 + 配置缓存，缩短重复构建耗时（与 Preview/Release 流水线共享同一份缓存）
      # configuration-cache.problems=warn：不兼容的任务仅告警并自动回退，不会让构建失败
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.configuration-cache.problems=warn
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Lint 较重，仅在 PR / 手动触发时运行作为质量门；push 到 dev/main 时跳过以加快反馈
      - name: Run lint
        if: github.event_name != 'push'
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build Debug APK & run unit tests (tests non-blocking)
        continue-on-error: true
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --continue --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-unit-test-reports
          path: |
            Bastion/app/build/reports/tests/testDebugUnitTest
            Bastion/app/build/test-results/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

      - name: List debug APK outputs
        run: find app/build/outputs/apk/debug -maxdepth 1 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: |
            Bastion/app/build/outputs/apk/debug/*.apk
            Bastion/app/build/outputs/apk/debug/*.APK
          retention-days: 7
          if-no-files-found: error
