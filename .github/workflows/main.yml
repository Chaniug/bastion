name: Android CI debug

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'Bastion/**/*.kt'
      - 'Bastion/**/*.java'
      - 'Bastion/**/*.xml'
      - 'Bastion/**/*.json'
      - 'Bastion/**/*.gradle'
      - 'Bastion/**/*.gradle.kts'
      - 'Bastion/**/*.kts'
      - 'Bastion/gradle/**'
      - 'Bastion/gradlew'
      - 'Bastion/gradlew.bat'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'Bastion/**/*.kt'
      - 'Bastion/**/*.java'
      - 'Bastion/**/*.xml'
      - 'Bastion/**/*.json'
      - 'Bastion/**/*.gradle'
      - 'Bastion/**/*.gradle.kts'
      - 'Bastion/**/*.kts'
      - 'Bastion/gradle/**'
      - 'Bastion/gradlew'
      - 'Bastion/gradlew.bat'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write   # 发 debug APK 到 preview Release 需要

# 取消策略：false = 连续推送时新 run 排队而非取消旧 run。
# 旧 run 跑完会把构建/配置缓存暖热，后续 run 命中缓存更快（公开仓库 CI 分钟无限，无成本顾虑）。
concurrency:
  group: android-ci-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ci:
    name: Lint, test diagnostics, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "Bastion"
    env:
      # 构建缓存 + 并行 + 配置缓存，缩短重复构建耗时（与 Preview/Release 流水线共享同一份缓存）
      # configuration-cache.problems=warn：不兼容的任务仅告警并自动回退，不会让构建失败
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.configuration-cache.problems=warn
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 浅克隆：CI debug 不依赖 git 历史，避免拉取大体积历史（.git 历史含旧构建产物），显著缩短 checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 诊断：在装 android-37 之前先摸清 runner 的 SDK 环境与对 dl.google.com 的可达性
      # （本仓库 only checks API 可读，故把关键信息打成 annotation 回传）
      - name: Diagnose SDK environment
        if: always()
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | head -3 | while IFS= read -r l; do echo "::notice title=java::$l"; done
          echo "::notice title=existing platforms::$(ls $ANDROID_SDK_ROOT/platforms 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=existing build-tools::$(ls $ANDROID_SDK_ROOT/build-tools 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=sdkmanager version::$($SDKM --version 2>&1 | head -3 | tr '\n' ' ')"
          # 测试到 dl.google.com 的可达性
          curl -sS -m 25 -o /tmp/repo.xml -w 'HTTP=%{http_code} size=%{size_download} exit=%{exitcode}\n' \
            "https://dl.google.com/android/repository/repository2-3.xml" \
            > /tmp/curl_test.txt 2>&1 || true
          cat /tmp/curl_test.txt
          echo "::notice title=curl dl.google.com::$(cat /tmp/curl_test.txt | tr '\n' ' ')"
          echo "::notice title=repo.xml head::$(head -c 200 /tmp/repo.xml 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=installed pkgs::$($SDKM --list_installed 2>&1 | head -20 | tr '\n' ' ')"

      # Phase A（API 37 / Android 17）：让 compileSdk 37 所需的 platforms/android-37 可用
      #
      # 诊断结论（run 31091502330 的 Diagnose SDK environment 步骤）：
      #   - runner 已预装 android-37 平台，但目录名为 android-37.0 / android-37.1
      #     （该镜像的 sdkmanager 12.0 把平台装成带修订号的目录名）。
      #   - AGP 的 compileSdk 37 只认 platforms/android-37（不带修订号），故找不到 → 构建失败。
      #   - 网络可达（curl dl.google.com HTTP=200），但 sdkmanager 12.0 的 JVM 在本环境
      #     加载包信息即失败（仅打印 "Loading package information..."），不可用。
      #
      # 正解：不再依赖 sdkmanager。优先把 platforms/android-37 符号链接到已装的
      # android-37.*；若镜像未来不再预装，则回退为 curl 直下 platform 压缩包（网络可用）。
      # build-tools 37.0.0 镜像已自带，无需处理。
      - name: Install Android SDK platform 37
        run: |
          PLAT="$ANDROID_SDK_ROOT/platforms"
          set -o pipefail
          if [ -d "$PLAT/android-37" ]; then
            echo "android-37 already present"
          else
            # 镜像预装的 android-37 平台目录名为 android-37.0 / android-37.1（sdkmanager 12.0 命名）。
            # 逐个检查 source.properties 的 AndroidVersion.ApiLevel，优先选恰好为 37 的，
            # 否则退而取 37.* 中修订号最大者，符号链接为 AGP 需要的 platforms/android-37。
            linked=""
            exact=""
            fallback_candidate=""
            for d in $(ls -d "$PLAT"/android-37.* 2>/dev/null | sort -V); do
              sp="$d/source.properties"
              [ -f "$sp" ] || continue
              lvl=$(grep -i 'AndroidVersion.ApiLevel' "$sp" | head -1 | cut -d= -f2 | tr -d ' ')
              echo "candidate $(basename "$d") ApiLevel=$lvl"
              case "$lvl" in
                37) exact="$d";;
                37*) fallback_candidate="$d";;
              esac
            done
            if [ -n "$exact" ]; then
              ln -s "$exact" "$PLAT/android-37"; linked="$exact"; echo "symlinked $(basename "$exact") -> android-37 (ApiLevel=37)"
            elif [ -n "$fallback_candidate" ]; then
              ln -s "$fallback_candidate" "$PLAT/android-37"; linked="$fallback_candidate"; echo "symlinked $(basename "$fallback_candidate") -> android-37 (ApiLevel 37.x)"
            fi
            if [ -z "$linked" ]; then
              # 镜像未预装时，用 curl 直下 platform 压缩包（解压后目录即 android-37）
              echo "::warning title=no preinstalled android-37::downloading via curl"
              curl -sSL -m 60 -o /tmp/repo2.xml "https://dl.google.com/android/repository/repository2-3.xml"
              REL=$(grep -oE 'platform-37_r[0-9]+\.zip' /tmp/repo2.xml | head -1)
              echo "platform zip: $REL"
              curl -sSL -m 180 -o /tmp/platform37.zip "https://dl.google.com/android/repository/$REL"
              mkdir -p "$PLAT"
              unzip -q -o /tmp/platform37.zip -d "$PLAT"
            fi
          fi
          # 校验：android-37 必须是含 ApiLevel 37* 的合法平台目录
          if [ ! -f "$PLAT/android-37/source.properties" ]; then
            echo "::error title=android-37 invalid::source.properties missing"
            ls -la "$PLAT" | while IFS= read -r l; do echo "::error title=platforms::$l"; done
            exit 1
          fi
          api=$(grep -i 'AndroidVersion.ApiLevel' "$PLAT/android-37/source.properties" | head -1 | cut -d= -f2 | tr -d ' ')
          echo "android-37 ApiLevel=$api"
          case "$api" in
            37*) echo "android-37 ApiLevel acceptable";;
            *) echo "::error title=android-37 wrong ApiLevel::$api (expected 37*)"; exit 1;;
          esac
          echo "android-37 present: $(ls -d $PLAT/android-37)"

      # Lint 较重，仅在 PR / 手动触发时运行作为质量门；push 到 dev/main 时跳过以加快反馈
      - name: Run lint
        if: github.event_name != 'push'
        run: ./gradlew :app:lintDebug --stacktrace

      # push 时用仓库固定 keystore 签名 debug APK，确保 preview 与 stable 签名一致、可互相覆盖安装
      - name: Decode signing keystore
        if: github.event_name == 'push'
        shell: bash
        run: |
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "::error title=Keystore decode failed::release.jks was not created or is empty."
            exit 1
          fi
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      # 1) 门禁：仅编译并产出 Debug APK（最快出包路径，不跑测试）
      # push 时注入固定签名，使 debug APK 与 stable release APK 签名一致，可互相覆盖安装
      - name: Build Debug APK (build gate)
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::notice title=Build gate diagnostics::build_failed=true"
            grep -E "^e: |error:|FAILURE|Caused by:|Could not|What went wrong|BUILD FAILED" /tmp/build_log.txt | head -40 | while IFS= read -r line; do
              echo "::notice title=build_gate::$line"
            done
            exit "$BUILD_EXIT"
          fi
          echo "::notice title=Build gate diagnostics::build_failed=false"
        env:
          BASTION_KS_FILE: ${{ github.event_name == 'push' && format('{0}/release.jks', github.workspace) || '' }}
          BASTION_KS_STORE_PASSWORD: ${{ github.event_name == 'push' && secrets.DEBUG_STORE_PASSWORD || '' }}
          BASTION_KS_ALIAS: ${{ github.event_name == 'push' && secrets.DEBUG_KEY_ALIAS || '' }}
          BASTION_KS_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.DEBUG_KEY_PASSWORD || '' }}

      # 2) 立即上传 APK —— 在跑测试之前，push 场景最快拿到包用于真机验证
      - name: List debug APK outputs
        run: find app/build/outputs/apk/debug -maxdepth 1 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: |
            Bastion/app/build/outputs/apk/debug/*.apk
            Bastion/app/build/outputs/apk/debug/*.APK
          if-no-files-found: error

      # 2.5) push 到 dev 时，把 debug APK 发布到 preview Release，方便直接从 Release 页下载真机验证。
      #      push 到 main（合并验证）跳过 preview 发布：preview 由 dev push 维护，main 合并不重复覆盖。
      - name: Generate preview version suffix
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        id: preview_meta
        shell: bash
        run: |
          suffix="build.$(date -u +%Y%m%d%H%M)"
          echo "preview_version_suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Cleanup previous preview release (assets + release + tag)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 删除已存在的 preview release（含 assets），再删除 tag，确保下次全新创建
          release_id="$(gh api repos/${{ github.repository }}/releases/tags/preview --jq '.id' 2>/dev/null || true)"
          if [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Deleting existing preview release id=${release_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/${release_id} 2>/dev/null || true
          else
            echo "No existing preview release to delete"
          fi
          # 删除 preview tag（不存在则忽略）
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/preview 2>/dev/null || true
          echo "Cleanup done"

      - name: Collect debug APK metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        id: apk_meta
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          apk_list="$(find . -maxdepth 1 -type f \( -iname '*.apk' -o -iname '*.APK' \) -printf '%f\n' | sort)"
          apk_count="$(printf '%s\n' "$apk_list" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$apk_count" = "0" ]; then
            echo "No debug APK found"; ls -la; exit 1
          fi
          apk_markdown="$(printf '%s\n' "$apk_list" | sed '/^$/d' | sed 's/^/> *   `/; s/$/`/')"
          echo "apk_count=${apk_count}" >> "$GITHUB_OUTPUT"
          {
            echo "apk_list<<EOF"
            printf '%s\n' "$apk_markdown"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Debug APK to preview Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: "⚠️ Development Preview (${{ steps.preview_meta.outputs.preview_version_suffix }})"
          body: |
            > **⚠️ 开发预览版本 (Debug APK)**
            >
            > 此版本为 debug 构建产物，用于快速体验最新代码，可能包含未完成功能或 Bug。
            > 正式使用请下载 Stable 版本。
            > ---
            > **构建信息：**
            > * **Build Suffix**: `${{ steps.preview_meta.outputs.preview_version_suffix }}`
            > * **Build Type**: `debug`
            > * **Commit SHA**: `${{ github.sha }}`
            > * **Ref**: `${{ github.ref }}`
            > **Generated APKs:**
            ${{ steps.apk_meta.outputs.apk_list }}
          files: |
            Bastion/app/build/outputs/apk/debug/*.apk
            Bastion/app/build/outputs/apk/debug/*.APK
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3) 单测（非阻塞，门禁已过不拖慢出包；保留排错信号）
      #    注意：本步骤 continue-on-error，失败不影响 job 结论。
      #    真正的回归判定由后面的 "Enforce unit test failure baseline" 闸门负责。
      - name: Run unit tests (non-blocking)
        id: unit_tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-unit-test-reports
          path: |
            Bastion/app/build/reports/tests/testDebugUnitTest
            Bastion/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      # 4) 回归基线闸门
      #    背景：单测步骤 continue-on-error，CI 恒绿，存量 22 个失效守卫无告警，
      #          新增失败只能靠人工扒日志发现（详见 docs/ci-test-signal-and-guard-test-debt.md）。
      #    策略：存量债不阻塞出包，但失败数一旦【超过基线】立即 fail；
      #          低于基线则告警提示下调 BASELINE_FAILURES，形成棘轮效应直至归零。
      #    附带：把失败测试【名单】打进 run summary，不必再手动下载日志比对。
      - name: Enforce unit test failure baseline
        if: always() && steps.unit_tests.outcome != 'skipped'
        env:
          # 当前基线。修好测试后必须同步下调，禁止上调（上调 = 接受新回归）。
          # 2026-08-01 Phase 1a：删除读取已删 MdbxManagerScreen.kt 的 3 个守卫函数
          # 及整个 MdbxAndroidIntegrationGuardTest.kt，失败数 22 -> 19。
          # 2026-08-01 Phase B.2.1：修复 TimelineSnapshotIntegrationGuardTest 过时的
          # Room 版本断言（73 -> 74），失败数 19 -> 18（总数 525 -> 538，
          # +13 为 B.2.2 复活的 AutofillLoggerTest，全部通过）。
          # 2026-08-01 Phase B.2.1 批次 1：修复 13 个守卫断言的文本漂移
          # （实现等价重构导致的源码文本失配，零主代码改动），失败数 18 -> 6。
          # 剩余 6 个的完整根因见 docs/architecture-phaseB-cleanup.md#b21，
          # 其中 5 个是"实现有意演进、测试过时"，1 个（ExpressiveTopBarKeyboard）
          # 疑似真实回归，需真机验证后修实现而非改测试。
          # 2026-08-01 Phase B.2.1 批次 2：重写 5 个"实现有意演进、测试过时"的守卫断言
          # （#2 实例复用白名单+onNewIntent / #6 AUTH 优先包装 / #10 KeePass 反死锁 /
          # #14 中英文案 / #16 Plus 免费化），失败数 6 -> 1（仅剩 #9 疑似真实回归）。
          # 2026-08-01 Phase B.2.1 批次 3：修复 #9 ExpressiveTopBar 搜索框真实回归
          # （已聚焦的搜索框被系统收起键盘后，再次点按重新唤出软键盘 keyboardController?.show()），
          # 失败数 1 -> 0。Phase B.2.1 守卫测试债务清零（19 -> 0）。
          BASELINE_FAILURES: "0"
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          baseline = int(os.environ.get("BASELINE_FAILURES", "0"))
          paths = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))

          if not paths:
              print("::error title=No test results::单测结果 XML 缺失，无法校验回归基线。")
              sys.exit(1)

          total = 0
          names = []
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  print(f"::warning title=Unparsable result::{path}: {exc}")
                  continue
              total += int(root.get("tests", 0) or 0)
              for case in root.iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  cls = (case.get("classname") or "").rsplit(".", 1)[-1]
                  names.append(f"{cls} > {case.get('name')}")

          names.sort()
          failed = len(names)
          verdict = "PASS" if failed <= baseline else "FAIL"

          lines = [
              "### Unit test baseline gate",
              "",
              f"- total: **{total}**",
              f"- failed: **{failed}**",
              f"- baseline: **{baseline}**",
              f"- verdict: **{verdict}**",
              "",
          ]
          if names:
              lines += ["<details><summary>Failed tests</summary>", ""]
              lines += [f"- `{n}`" for n in names]
              lines += ["", "</details>"]

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")

          print(f"total={total} failed={failed} baseline={baseline}")
          for name in names:
              print(f"  FAILED  {name}")
              # 每个失败测试单独打一条注解：step summary / 日志在协作环境里
              # 因 blob.core.windows.net 被 DNS 劫持拿不到，唯有 checks API 注解稳定可读。
              # 这样 `gh api .../check-runs/<id>/annotations` 能直接列出失败测试名。
              print(f"::error title=Failed test::{name}")

          # 把统计发成 annotation。原因：本仓库的协作环境里
          # blob.core.windows.net（run log / artifact 的实际下载源）会被 DNS 劫持到
          # 198.18.0.0/15 保留段，`gh run view --log` 与 `gh run download` 全部拿不到数据，
          # 只有 api.github.com 通。annotation 走 checks API，因此是唯一稳定可读的回传通道。
          # 有了它，排错时用
          #   gh api repos/<owner>/<repo>/check-runs/<id>/annotations
          # 就能直接看到 total/failed，不必再下载日志。
          print(
              f"::notice title=Unit test stats::total={total} failed={failed} "
              f"baseline={baseline} verdict={verdict}"
          )

          if failed > baseline:
              print(
                  f"::error title=New test regressions::失败数 {failed} 超过基线 {baseline}，"
                  f"本次改动引入了 {failed - baseline} 个新失败。"
              )
              sys.exit(1)

          if failed < baseline:
              print(
                  f"::warning title=Baseline can be lowered::失败数 {failed} 已低于基线 {baseline}，"
                  f"请把 BASELINE_FAILURES 下调为 {failed} 以锁定改进。"
              )

          print("Baseline gate passed.")
          PY

      # 5) 排错辅助：仅在失败时打印环境/缓存信息（成功时省几秒，出包更快）
      - name: Diagnostics - cache & environment
        if: failure()
        run: |
          echo "Gradle wrapper:"; grep distributionUrl gradle/wrapper/gradle-wrapper.properties || true
          echo "Build cache dir size:"; du -sh ~/.gradle/caches/build-cache-1 2>/dev/null || echo "n/a"
          echo "Gradle home size:"; du -sh ~/.gradle 2>/dev/null || echo "n/a"
          echo "Java:"; java -version 2>&1 | head -1 || true
