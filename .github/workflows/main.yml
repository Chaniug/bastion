name: Android CI debug

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'Bastion/**/*.kt'
      - 'Bastion/**/*.java'
      - 'Bastion/**/*.xml'
      - 'Bastion/**/*.gradle'
      - 'Bastion/**/*.gradle.kts'
      - 'Bastion/**/*.kts'
      - 'Bastion/gradle/**'
      - 'Bastion/gradlew'
      - 'Bastion/gradlew.bat'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'Bastion/**/*.kt'
      - 'Bastion/**/*.java'
      - 'Bastion/**/*.xml'
      - 'Bastion/**/*.gradle'
      - 'Bastion/**/*.gradle.kts'
      - 'Bastion/**/*.kts'
      - 'Bastion/gradle/**'
      - 'Bastion/gradlew'
      - 'Bastion/gradlew.bat'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write   # 发 debug APK 到 preview Release 需要

# 取消策略：false = 连续推送时新 run 排队而非取消旧 run。
# 旧 run 跑完会把构建/配置缓存暖热，后续 run 命中缓存更快（公开仓库 CI 分钟无限，无成本顾虑）。
concurrency:
  group: android-ci-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ci:
    name: Lint, test diagnostics, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "Bastion"
    env:
      # 构建缓存 + 并行 + 配置缓存，缩短重复构建耗时（与 Preview/Release 流水线共享同一份缓存）
      # configuration-cache.problems=warn：不兼容的任务仅告警并自动回退，不会让构建失败
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.configuration-cache.problems=warn
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 浅克隆：CI debug 不依赖 git 历史，避免拉取大体积历史（.git 历史含旧构建产物），显著缩短 checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Lint 较重，仅在 PR / 手动触发时运行作为质量门；push 到 dev/main 时跳过以加快反馈
      - name: Run lint
        if: github.event_name != 'push'
        run: ./gradlew :app:lintDebug --stacktrace

      # 1) 门禁：仅编译并产出 Debug APK（最快出包路径，不跑测试）
      - name: Build Debug APK (build gate)
        run: ./gradlew :app:assembleDebug --stacktrace

      # 2) 立即上传 APK —— 在跑测试之前，push 场景最快拿到包用于真机验证
      - name: List debug APK outputs
        run: find app/build/outputs/apk/debug -maxdepth 1 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: |
            Bastion/app/build/outputs/apk/debug/*.apk
            Bastion/app/build/outputs/apk/debug/*.APK
          if-no-files-found: error

      # 2.5) push 到 dev/main 时，把 debug APK 发布到 preview Release，方便直接从 Release 页下载真机验证
      - name: Generate preview version suffix
        if: github.event_name == 'push'
        id: preview_meta
        shell: bash
        run: |
          suffix="build.$(date -u +%Y%m%d%H%M)"
          echo "preview_version_suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Cleanup previous preview release assets
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_id="$(gh api repos/${{ github.repository }}/releases/tags/preview --jq '.id' 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            echo "No existing preview release assets to clean"
            exit 0
          fi
          asset_ids="$(gh api repos/${{ github.repository }}/releases/${release_id}/assets --paginate --jq '.[].id')"
          if [ -z "$asset_ids" ]; then
            echo "Preview release has no existing assets"
            exit 0
          fi
          while IFS= read -r asset_id; do
            [ -z "$asset_id" ] && continue
            echo "Deleting previous preview asset id=${asset_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/${asset_id}
          done <<< "$asset_ids"

      - name: Collect debug APK metadata
        if: github.event_name == 'push'
        id: apk_meta
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          apk_list="$(find . -maxdepth 1 -type f \( -iname '*.apk' -o -iname '*.APK' \) -printf '%f\n' | sort)"
          apk_count="$(printf '%s\n' "$apk_list" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$apk_count" = "0" ]; then
            echo "No debug APK found"; ls -la; exit 1
          fi
          apk_markdown="$(printf '%s\n' "$apk_list" | sed '/^$/d' | sed 's/^/> *   `/; s/$/`/')"
          echo "apk_count=${apk_count}" >> "$GITHUB_OUTPUT"
          {
            echo "apk_list<<EOF"
            printf '%s\n' "$apk_markdown"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Debug APK to preview Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: "⚠️ Development Preview (${{ steps.preview_meta.outputs.preview_version_suffix }})"
          body: |
            > **⚠️ 开发预览版本 (Debug APK)**
            >
            > 此版本为 debug 构建产物，用于快速体验最新代码，可能包含未完成功能或 Bug。
            > 正式使用请下载 Stable 版本。
            > ---
            > **构建信息：**
            > * **Build Suffix**: `${{ steps.preview_meta.outputs.preview_version_suffix }}`
            > * **Build Type**: `debug`
            > * **Commit SHA**: `${{ github.sha }}`
            > * **Ref**: `${{ github.ref }}`
            > **Generated APKs:**
            ${{ steps.apk_meta.outputs.apk_list }}
          files: |
            Bastion/app/build/outputs/apk/debug/*.apk
            Bastion/app/build/outputs/apk/debug/*.APK
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3) 单测（非阻塞，门禁已过不拖慢出包；保留排错信号）
      - name: Run unit tests (non-blocking)
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-unit-test-reports
          path: |
            Bastion/app/build/reports/tests/testDebugUnitTest
            Bastion/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      # 4) 排错辅助：测试摘要写入 run summary，一眼看清通过/失败数
      - name: Summarize test results
        if: always()
        run: |
          res_dir="app/build/test-results/testDebugUnitTest"
          echo "### Unit test summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$res_dir" ] && ls "$res_dir"/*.xml >/dev/null 2>&1; then
            grep -h 'testsuite ' "$res_dir"/*.xml \
              | sed -E 's/.*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/- tests: \1 | failures: \2 | errors: \3/' \
              >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "- no results" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 5) 排错辅助：仅在失败时打印环境/缓存信息（成功时省几秒，出包更快）
      - name: Diagnostics - cache & environment
        if: failure()
        run: |
          echo "Gradle wrapper:"; grep distributionUrl gradle/wrapper/gradle-wrapper.properties || true
          echo "Build cache dir size:"; du -sh ~/.gradle/caches/build-cache-1 2>/dev/null || echo "n/a"
          echo "Gradle home size:"; du -sh ~/.gradle 2>/dev/null || echo "n/a"
          echo "Java:"; java -version 2>&1 | head -1 || true
