<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bastion — 本地优先 · 零知识 · 开源的 Android 密码管理器">
  <defs>
    <!-- 背景渐变：深空蓝紫 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="35%" stop-color="#0D1137"/>
      <stop offset="65%" stop-color="#0F1A3A"/>
      <stop offset="100%" stop-color="#0B122E"/>
    </linearGradient>

    <!-- 弥散光晕 — 右上金色 -->
    <radialGradient id="haloGold" cx="78%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#F5B942" stop-opacity="0.20"/>
      <stop offset="35%" stop-color="#F5B942" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>

    <!-- 弥散光晕 — 右下蓝色 -->
    <radialGradient id="haloBlue" cx="62%" cy="72%" r="52%">
      <stop offset="0%" stop-color="#5FB0F2" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#2E7CC8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2E7CC8" stop-opacity="0"/>
    </radialGradient>

    <!-- 弥散光晕 — 左侧紫色 -->
    <radialGradient id="haloPurple" cx="12%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 盾牌玻璃主体渐变（半透明，轻盈） -->
    <linearGradient id="shieldBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2A3F7A" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#16244E" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0C1530" stop-opacity="0.92"/>
    </linearGradient>

    <!-- 盾牌竖向高光（玻璃反光） -->
    <linearGradient id="shieldGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="22%" stop-color="#9FD4FF" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#5FB0F2" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- 锁孔金色渐变 -->
    <linearGradient id="keyholeGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE6A8"/>
      <stop offset="35%" stop-color="#F5B942"/>
      <stop offset="70%" stop-color="#E5A820"/>
      <stop offset="100%" stop-color="#C8860A"/>
    </linearGradient>

    <!-- 品牌文字金色渐变 -->
    <linearGradient id="textGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5B942"/>
      <stop offset="50%" stop-color="#FFD874"/>
      <stop offset="100%" stop-color="#F5B942"/>
    </linearGradient>

    <!-- 锁孔发光 -->
    <radialGradient id="keyholeGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFE6A8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#F5B942" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>

    <!-- 网格图案 -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#9FD4FF" stroke-opacity="0.04" stroke-width="0.8"/>
    </pattern>

    <!-- 高斯模糊 -->
    <filter id="blurLg"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="blurMd"><feGaussianBlur stdDeviation="16"/></filter>

    <!-- 盾牌柔和投影 -->
    <filter id="shieldShadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#05070F" flood-opacity="0.55"/>
    </filter>

    <!-- 锁孔发光滤镜 -->
    <filter id="glowFilter" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- 弥散光晕 -->
  <rect width="1280" height="640" fill="url(#haloGold)"/>
  <rect width="1280" height="640" fill="url(#haloBlue)"/>
  <rect width="1280" height="640" fill="url(#haloPurple)"/>

  <!-- 网格 -->
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- ==================== 右侧视觉区：修长玻璃盾牌 ==================== -->
  <g transform="translate(720, 56)">
    <!-- 背后柔光 -->
    <ellipse cx="340" cy="320" rx="190" ry="240" fill="url(#keyholeGlow)" filter="url(#blurLg)" opacity="0.45"/>
    <ellipse cx="340" cy="320" rx="120" ry="150" fill="url(#keyholeGlow)" filter="url(#blurMd)" opacity="0.35"/>

    <!-- 环绕细轨道线（轻装饰） -->
    <g opacity="0.12" stroke="#9FD4FF" stroke-width="0.8" fill="none">
      <ellipse cx="340" cy="320" rx="180" ry="220" stroke-dasharray="6 14" transform="rotate(-12,340,320)"/>
      <ellipse cx="340" cy="320" rx="205" ry="165" stroke-dasharray="4 18" transform="rotate(22,340,320)"/>
    </g>

    <!-- 数据粒子点 -->
    <g>
      <circle cx="120" cy="180" r="2.2" fill="#9FD4FF" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="240" r="2" fill="#FFE6A8" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="540" cy="420" r="2.4" fill="#5FB0F2" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="460" r="1.8" fill="#7C4DFF" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ====== 修长玻璃盾牌 ====== -->
    <g filter="url(#shieldShadow)">
      <!-- 主体（高宽比约 1.42，轻盈半透明） -->
      <path d="M236 158
               C236 158 286 138 340 138
               C394 138 444 158 444 158
               L444 330
               C444 420 392 492 340 548
               C288 492 236 420 236 330
               Z"
            fill="url(#shieldBody)" stroke="#3E6FC0" stroke-opacity="0.55" stroke-width="1.6"/>

      <!-- 玻璃竖向反光层 -->
      <path d="M236 158 C236 158 286 138 340 138 C394 138 444 158 444 158
               L444 330 C444 420 392 492 340 548 C288 492 236 420 236 330 Z"
            fill="url(#shieldGlass)"/>

      <!-- 内描边（细，精致） -->
      <path d="M250 170 C250 170 294 152 340 152 C386 152 430 170 430 170
               L430 328 C430 410 382 476 340 530 C298 476 250 410 250 328 Z"
            fill="none" stroke="#7FC4FF" stroke-opacity="0.18" stroke-width="1"/>

      <!-- 顶部高光弧 -->
      <path d="M236 158 C236 158 286 138 340 138 C394 138 444 158 444 158"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4"/>

      <!-- 左侧竖向反光条（玻璃质感） -->
      <path d="M266 178 L266 330 C266 396 296 452 326 496"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6" stroke-linecap="round"/>

      <!-- 内部细密横纹（数据/加密纹理） -->
      <g stroke="#7FC4FF" stroke-opacity="0.06" stroke-width="0.8">
        <path d="M252 250 L428 250" fill="none"/>
        <path d="M258 290 L422 290" fill="none"/>
        <path d="M266 330 L414 330" fill="none"/>
        <path d="M276 370 L404 370" fill="none"/>
      </g>
    </g>

    <!-- ====== 锁孔（精致居中） ====== -->
    <g>
      <circle cx="340" cy="300" r="26" fill="url(#keyholeGlow)" filter="url(#glowFilter)" opacity="0.85"/>

      <!-- 外环 -->
      <circle cx="340" cy="300" r="20" fill="none" stroke="url(#keyholeGold)" stroke-width="3.5" opacity="0.95"/>

      <!-- 内核 -->
      <circle cx="340" cy="300" r="15" fill="#0C1530"/>
      <circle cx="340" cy="300" r="11" fill="url(#keyholeGlow)" opacity="0.55"/>

      <!-- 下方钥匙杆 -->
      <rect x="333" y="306" width="14" height="34" rx="3" fill="#0C1530"/>
      <rect x="333" y="306" width="14" height="34" rx="3" fill="none" stroke="url(#keyholeGold)" stroke-width="2.6" opacity="0.9"/>
      <rect x="337" y="312" width="6" height="22" rx="2" fill="url(#keyholeGlow)" opacity="0.4"/>

      <!-- 底部小圆角收尾 -->
      <path d="M336 338 A6 6 0 0 0 344 338" fill="none" stroke="url(#keyholeGold)" stroke-width="2.4" opacity="0.75"/>
    </g>

    <!-- 加密数据流线 -->
    <g opacity="0.22">
      <path d="M260 250 Q310 250 340 290" fill="none" stroke="#5FB0F2" stroke-width="0.8" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M420 250 Q380 270 360 295" fill="none" stroke="#FFE6A8" stroke-width="0.8" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M340 430 Q340 400 340 345" fill="none" stroke="#7C4DFF" stroke-width="0.8" stroke-dasharray="3 9">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- ==================== 左侧文字区 ==================== -->
  <g transform="translate(72, 0)">
    <!-- 小标签 pill -->
    <rect x="0" y="185" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#9FD4FF" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="20" cy="201" r="4" fill="#5FB0F2"/>
    <text x="36" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#9FD4FF" letter-spacing="2">本地优先 · 零知识 · 开源</text>

    <!-- 主标题 — 品牌名 -->
    <text x="0" y="272" font-family="'Sora','Segoe UI Semibold','PingFang SC','Microsoft YaHei',sans-serif" font-size="88" font-weight="800" letter-spacing="1.5">
      <tspan fill="#FFFFFF">bas</tspan><tspan fill="url(#textGold)">tion</tspan>
    </text>

    <!-- 下划线装饰 -->
    <rect x="0" y="292" width="120" height="4.5" rx="2.25" fill="url(#textGold)" opacity="0.85"/>

    <!-- 副标题 -->
    <text x="0" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#8899B5" letter-spacing="1.5">把密码锁进你自己的堡垒</text>

    <!-- 三行特性 -->
    <g transform="translate(0, 398)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="18" cy="18" r="3.5" fill="#5FB0F2"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9BBD0">AES-256-GCM 端到端加密</text>
    </g>
    <g transform="translate(0, 442)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="18" cy="18" r="3.5" fill="#F5B942"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9BBD0">硬件 Keystore（TEE）安全隔离</text>
    </g>
    <g transform="translate(0, 486)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="18" cy="18" r="3.5" fill="#7C4DFF"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9BBD0">完全离线 · 无需网络权限</text>
    </g>

    <!-- 底部标签 -->
    <g transform="translate(0, 548)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#5FB0F2" fill-opacity="0.1" stroke="#5FB0F2" stroke-opacity="0.25"/>
      <text x="14" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#9FD4FF">Android 17</text>

      <rect x="122" y="0" width="136" height="28" rx="14" fill="#F5B942" fill-opacity="0.1" stroke="#F5B942" stroke-opacity="0.25"/>
      <text x="136" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#FFE6A8">Bitwarden 兼容</text>

      <rect x="268" y="0" width="130" height="28" rx="14" fill="#7C4DFF" fill-opacity="0.1" stroke="#7C4DFF" stroke-opacity="0.25"/>
      <text x="282" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#B39DDB">KeePass 兼容</text>
    </g>
  </g>

  <!-- 极淡噪点覆盖 -->
  <rect width="1280" height="640" fill="#0A0E27" opacity="0.03" style="mix-blend-mode: overlay"/>
</svg>
