<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bastion — 本地优先 · 零知识 · 开源的 Android 密码管理器">
  <defs>
    <!-- 深空科技背景 -->
    <radialGradient id="bgGrad" cx="55%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0A1428"/>
      <stop offset="40%" stop-color="#050B16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- 中心青色辉光 -->
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="30%" stop-color="#00B8D4" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#007C91" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 霓虹青色描边渐变 -->
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B8D4"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- 霓虹蓝渐变 -->
    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- 金色点缀渐变 -->
    <linearGradient id="neonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- 强霓虹发光 -->
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 中强度发光 -->
    <filter id="glowMid" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 柔和模糊 -->
    <filter id="blurSoft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blurLarge"><feGaussianBlur stdDeviation="48"/></filter>

    <!-- 地面透视网格 -->
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00B8D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00B8D4" stop-opacity="0"/>
    </linearGradient>

    <!-- 文字金色 -->
    <linearGradient id="textGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>

    <!-- 盾牌透明填充 -->
    <linearGradient id="shieldGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#007C91" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#002B36" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- 中心辉光 -->
  <ellipse cx="1040" cy="320" rx="420" ry="340" fill="url(#cyberGlow)" filter="url(#blurLarge)" opacity="0.9"/>

  <!-- ==================== 地面透视网格 ==================== -->
  <g transform="translate(0, 520)" opacity="0.25">
    <!-- 水平渐变地平线 -->
    <rect x="600" y="0" width="680" height="120" fill="url(#floorFade)" opacity="0.3"/>
    <!-- 向中心汇聚的透视竖线 -->
    <g stroke="#00E5FF" stroke-width="0.8" fill="none" stroke-opacity="0.18">
      <line x1="840" y1="120" x2="1040" y2="0"/>
      <line x1="930" y1="120" x2="1040" y2="0"/>
      <line x1="1010" y1="120" x2="1040" y2="0"/>
      <line x1="1070" y1="120" x2="1040" y2="0"/>
      <line x1="1140" y1="120" x2="1040" y2="0"/>
      <line x1="1230" y1="120" x2="1040" y2="0"/>
    </g>
    <!-- 横向远处线条 -->
    <g stroke="#00B8D4" stroke-width="0.6" fill="none" stroke-opacity="0.12">
      <line x1="640" y1="100" x2="1280" y2="100"/>
      <line x1="680" y1="78" x2="1280" y2="78"/>
      <line x1="740" y1="56" x2="1280" y2="56"/>
      <line x1="820" y1="34" x2="1280" y2="34"/>
    </g>
  </g>

  <!-- ==================== 右侧全息盾牌区 ==================== -->
  <g transform="translate(700, 40)">
    <!-- 外层大光环（虚线） -->
    <ellipse cx="340" cy="320" rx="220" ry="240" fill="none" stroke="url(#neonCyan)" stroke-width="1.2" stroke-dasharray="12 18" opacity="0.25" filter="url(#glowMid)"/>
    <ellipse cx="340" cy="320" rx="190" ry="210" fill="none" stroke="url(#neonBlue)" stroke-width="0.8" stroke-dasharray="6 24" transform="rotate(30,340,320)" opacity="0.18"/>

    <!-- 动态扫描环 -->
    <ellipse cx="340" cy="320" rx="250" ry="270" fill="none" stroke="#00E5FF" stroke-width="0.6" stroke-dasharray="4 40" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0 340 320" to="360 340 320" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 浮动粒子 -->
    <g fill="#00E5FF" filter="url(#glowMid)">
      <circle cx="140" cy="200" r="2">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="540" cy="160" r="2.2">
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="460" r="2.5">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="440" r="1.8">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="120" r="1.6">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="520" r="2">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ====== 3D 全息盾牌 ====== -->
    <g filter="url(#glowStrong)">
      <!-- 后层（厚度感） -->
      <path d="M250 175 L430 175 L430 340 C430 405 390 460 340 500 C290 460 250 405 250 340 Z"
            fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.25" transform="translate(4,4)"/>

      <!-- 主盾体外框 -->
      <path d="M250 170
               C250 170 295 150 340 150
               C385 150 430 170 430 170
               L430 340
               C430 408 388 462 340 505
               C292 462 250 408 250 340
               Z"
            fill="url(#shieldGlass)" stroke="url(#neonCyan)" stroke-width="2.2" stroke-linejoin="round"/>

      <!-- 内框线 -->
      <path d="M272 188
               C272 188 308 172 340 172
               C372 172 408 188 408 188
               L408 340
               C408 394 374 440 340 474
               C306 440 272 394 272 340
               Z"
            fill="none" stroke="url(#neonBlue)" stroke-width="1" stroke-opacity="0.9" stroke-dasharray="8 6"/>

      <!-- 内部结构竖线（3D 立体感） -->
      <g stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.25" fill="none">
        <line x1="340" y1="172" x2="340" y2="474"/>
        <line x1="290" y1="220" x2="290" y2="410"/>
        <line x1="390" y1="220" x2="390" y2="410"/>
        <line x1="275" y1="270" x2="405" y2="270"/>
        <line x1="275" y1="340" x2="405" y2="340"/>
        <line x1="288" y1="405" x2="392" y2="405"/>
      </g>

      <!-- 左上角高光 -->
      <path d="M250 170 C250 170 295 150 340 150 C385 150 430 170 430 170"
            fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4"/>
    </g>

    <!-- ====== 中央加密核心（全息立方体） ====== -->
    <g transform="translate(340, 320)" filter="url(#glowStrong)">
      <!-- 后层面 -->
      <path d="M-40 -48 L0 -68 L40 -48 L0 -28 Z" fill="#00E5FF" fill-opacity="0.05" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3"/>
      <path d="M-40 -48 L-40 12 L0 32 L0 -28 Z" fill="#00B8D4" fill-opacity="0.06" stroke="#00B8D4" stroke-width="1" stroke-opacity="0.35"/>
      <path d="M40 -48 L40 12 L0 32 L0 -28 Z" fill="#007C91" fill-opacity="0.08" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.35"/>

      <!-- 前层面 -->
      <path d="M-40 -28 L0 -8 L40 -28 L0 -48 Z" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-width="1.6"/>
      <path d="M-40 -28 L-40 32 L0 52 L0 -8 Z" fill="#00B8D4" fill-opacity="0.14" stroke="#00B8D4" stroke-width="1.4"/>
      <path d="M40 -28 L40 32 L0 52 L0 -8 Z" fill="#007C91" fill-opacity="0.18" stroke="#00E5FF" stroke-width="1.4"/>

      <!-- 核心光环 -->
      <circle cx="0" cy="12" r="20" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="4 6">
        <animateTransform attributeName="transform" type="rotate" from="0 0 12" to="360 0 12" dur="8s" repeatCount="indefinite"/>
      </circle>

      <!-- 内部锁形 -->
      <g transform="translate(0, 10)" stroke="url(#neonGold)" fill="none" stroke-width="2">
        <circle cx="0" cy="-4" r="7" stroke-linecap="round"/>
        <rect x="-5" y="-2" width="10" height="10" rx="1.5"/>
      </g>
    </g>

    <!-- 核心到盾牌的连接线（数据流） -->
    <g stroke="#00E5FF" stroke-width="0.8" fill="none" opacity="0.4">
      <path d="M300 285 L340 220" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M380 285 L340 220" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M340 372 L340 420" stroke-dasharray="3 6">
        <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M300 355 L250 390" stroke-dasharray="3 7" stroke="#00B8D4">
        <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M380 355 L430 390" stroke-dasharray="3 7" stroke="#00B8D4">
        <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 左右小装饰：数据节点 -->
    <g opacity="0.6">
      <circle cx="180" cy="320" r="18" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="180" cy="320" r="4" fill="#00E5FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="320" r="18" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="500" cy="320" r="4" fill="#00E5FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ==================== 左侧文字区 ==================== -->
  <g transform="translate(72, 0)">
    <!-- 小标签 pill -->
    <rect x="0" y="185" width="170" height="32" rx="16" fill="#00E5FF" fill-opacity="0.06" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="20" cy="201" r="4" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#00E5FF" letter-spacing="2">本地优先 · 零知识 · 开源</text>

    <!-- 主标题 — 品牌名 -->
    <text x="0" y="272" font-family="'Sora','Segoe UI Semibold','PingFang SC','Microsoft YaHei',sans-serif" font-size="88" font-weight="800" letter-spacing="1.5" filter="url(#glowMid)">
      <tspan fill="#FFFFFF">bas</tspan><tspan fill="url(#textGold)">tion</tspan>
    </text>

    <!-- 下划线装饰 -->
    <rect x="0" y="292" width="120" height="4.5" rx="2.25" fill="url(#neonCyan)" opacity="0.9" filter="url(#glowMid)"/>

    <!-- 副标题 -->
    <text x="0" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#8AA3C0" letter-spacing="1.5">把密码锁进你自己的堡垒</text>

    <!-- 三行特性 -->
    <g transform="translate(0, 398)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#00E5FF" fill-opacity="0.04" stroke="#00E5FF" stroke-opacity="0.10"/>
      <circle cx="18" cy="18" r="3.5" fill="#00E5FF"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9C0D8">AES-256-GCM 端到端加密</text>
    </g>
    <g transform="translate(0, 442)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#00E5FF" fill-opacity="0.04" stroke="#00E5FF" stroke-opacity="0.10"/>
      <circle cx="18" cy="18" r="3.5" fill="#FFC107"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9C0D8">硬件 Keystore（TEE）安全隔离</text>
    </g>
    <g transform="translate(0, 486)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#00E5FF" fill-opacity="0.04" stroke="#00E5FF" stroke-opacity="0.10"/>
      <circle cx="18" cy="18" r="3.5" fill="#7C4DFF"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9C0D8">完全离线 · 无需网络权限</text>
    </g>

    <!-- 底部标签 -->
    <g transform="translate(0, 548)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#00E5FF" fill-opacity="0.08" stroke="#00E5FF" stroke-opacity="0.30"/>
      <text x="14" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#00E5FF">Android 17</text>

      <rect x="122" y="0" width="136" height="28" rx="14" fill="#FFC107" fill-opacity="0.08" stroke="#FFC107" stroke-opacity="0.30"/>
      <text x="136" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#FFE082">Bitwarden 兼容</text>

      <rect x="268" y="0" width="130" height="28" rx="14" fill="#7C4DFF" fill-opacity="0.08" stroke="#7C4DFF" stroke-opacity="0.30"/>
      <text x="282" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#B39DDB">KeePass 兼容</text>
    </g>
  </g>

  <!-- 全局噪点覆盖（极淡） -->
  <rect width="1280" height="640" fill="#000000" opacity="0.03" style="mix-blend-mode: overlay" pointer-events="none"/>
</svg>
