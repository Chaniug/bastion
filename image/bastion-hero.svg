<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bastion — local-first, open source, your fortress">
  <title>Bastion — Local-first · Open source · Your fortress</title>
  <defs>
    <!-- ================= 背景 ================= -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2545"/>
      <stop offset="48%" stop-color="#0B2E52"/>
      <stop offset="100%" stop-color="#061426"/>
    </linearGradient>

    <!-- 堡垒背后的金色辉光 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B942" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#F5B942" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>

    <!-- 顶部冷光，拉开纵向层次 -->
    <radialGradient id="topLight" cx="50%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#9FD4FF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9FD4FF" stop-opacity="0"/>
    </radialGradient>

    <!-- ================= 玻璃拟态堡垒 ================= -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#9FD4FF" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#4A82C4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0B2E52" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BFE4FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9FD4FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5E9BD6" stop-opacity="0.28"/>
    </linearGradient>

    <!-- 顶部高光：斜向一道，营造玻璃反光 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE6A8"/>
      <stop offset="48%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#B9760F"/>
    </linearGradient>

    <!-- ================= 滤镜 ================= -->
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glowTight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- ================= 堡垒轮廓（可复用） =================
         对称几何：顶部 4 个城垛 + 收腰塔身 + 盾形收尖。
         中心 x=640；肩 560–720；垛口区 574–706；塔身 576–704；底尖 y=276。 -->
    <path id="keep" d="M 560 86
      L 574 86 L 574 60 L 595 60 L 595 86
      L 611 86 L 611 60 L 632 60 L 632 86
      L 648 86 L 648 60 L 669 60 L 669 86
      L 685 86 L 685 60 L 706 60 L 706 86
      L 720 86 L 720 114 L 704 132 L 704 190
      C 704 228 676 258 640 276
      C 604 258 576 228 576 190
      L 576 132 L 560 114 Z"/>
  </defs>

  <!-- ================= 画布 ================= -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#topLight)"/>

  <!-- 极细网格：只作质感底纹，不做透视地面 -->
  <g stroke="#9FD4FF" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 70H1280M0 140H1280M0 210H1280M0 280H1280M0 350H1280"/>
    <path d="M160 0V420M320 0V420M480 0V420M640 0V420M800 0V420M960 0V420M1120 0V420"/>
  </g>

  <!-- 堡垒辉光 -->
  <ellipse cx="640" cy="168" rx="250" ry="200" fill="url(#halo)"/>

  <!-- 防护环：两层同心细环，暗示"层层设防" -->
  <circle cx="640" cy="168" r="196" fill="none" stroke="#9FD4FF"
          stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="640" cy="168" r="218" fill="none" stroke="#F5B942"
          stroke-opacity="0.22" stroke-width="1"
          stroke-dasharray="3 13" stroke-linecap="round"/>

  <!-- ================= 堡垒本体 ================= -->
  <g>
    <!-- 外发光 -->
    <use href="#keep" fill="none" stroke="#9FD4FF" stroke-opacity="0.30"
         stroke-width="6" filter="url(#glowSoft)"/>
    <!-- 玻璃主体 -->
    <use href="#keep" fill="url(#glassFill)"/>
    <!-- 描边 -->
    <use href="#keep" fill="none" stroke="url(#glassEdge)" stroke-width="2.5"
         stroke-linejoin="round"/>
    <!-- 左上斜向高光 -->
    <use href="#keep" fill="url(#sheen)"/>
  </g>

  <!-- 锁孔：金色点睛 -->
  <g filter="url(#glowTight)" opacity="0.55">
    <circle cx="640" cy="146" r="15" fill="#F5B942"/>
    <path d="M 628 153 L 652 153 L 656 187 L 624 187 Z" fill="#F5B942"/>
  </g>
  <g>
    <circle cx="640" cy="146" r="15" fill="url(#gold)"/>
    <path d="M 628 153 L 652 153 L 656 187 L 624 187 Z" fill="url(#gold)"/>
    <circle cx="640" cy="146" r="15" fill="none" stroke="#7A4E07"
            stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- ================= 文字（纯英文，避免字体缺失导致方块） ================= -->
  <g text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="640" y="352" fill="#FFFFFF" font-size="62" font-weight="800"
          letter-spacing="14">BASTION</text>
    <text x="640" y="390" fill="#9FD4FF" font-size="15" font-weight="600"
          letter-spacing="6.5" opacity="0.9">LOCAL-FIRST &#183; OPEN SOURCE &#183; YOUR FORTRESS</text>
  </g>

  <!-- 标题下的金色分隔线 -->
  <rect x="596" y="366" width="88" height="2.5" rx="1.25" fill="url(#gold)" opacity="0.85"/>
</svg>
