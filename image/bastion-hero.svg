<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bastion — 本地优先 · 零知识 · 开源的 Android 密码管理器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1336"/><stop offset="0.55" stop-color="#070C22"/><stop offset="1" stop-color="#04060F"/></linearGradient>
    <radialGradient id="halo" cx="72%" cy="46%" r="60%"><stop offset="0" stop-color="#F5B942" stop-opacity="0.16"/><stop offset="45%" stop-color="#2E7CC8" stop-opacity="0.13"/><stop offset="100%" stop-color="#2E7CC8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F5B942" stop-opacity="0.5"/><stop offset="100%" stop-color="#F5B942" stop-opacity="0"/></radialGradient>
    <linearGradient id="magGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B942" stop-opacity="0.15"/><stop offset="0.5" stop-color="#FFD874"/><stop offset="1" stop-color="#F5B942" stop-opacity="0.15"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9FD4FF" fill-opacity="0.06"/></pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4.5"/></filter>
        <linearGradient id="gt_loc" gradientUnits="userSpaceOnUse" x1="946.0" y1="150.0" x2="946.0" y2="224.0"><stop offset="0" stop-color="#ECFCFF"/><stop offset="1" stop-color="#83E1F2"/></linearGradient>
    <linearGradient id="gl_loc" gradientUnits="userSpaceOnUse" x1="881.9" y1="187.0" x2="946.0" y2="298.0"><stop offset="0" stop-color="#59C7E6"/><stop offset="1" stop-color="#2E9BC2"/></linearGradient>
    <linearGradient id="gr_loc" gradientUnits="userSpaceOnUse" x1="1010.1" y1="187.0" x2="946.0" y2="298.0"><stop offset="0" stop-color="#2E9BC2"/><stop offset="1" stop-color="#16708F"/></linearGradient>
    <linearGradient id="gt_key" gradientUnits="userSpaceOnUse" x1="850.0" y1="306.0" x2="850.0" y2="380.0"><stop offset="0" stop-color="#ECF4FF"/><stop offset="1" stop-color="#93C2F5"/></linearGradient>
    <linearGradient id="gl_key" gradientUnits="userSpaceOnUse" x1="785.9" y1="343.0" x2="850.0" y2="454.0"><stop offset="0" stop-color="#4F97E0"/><stop offset="1" stop-color="#2E6FC8"/></linearGradient>
    <linearGradient id="gr_key" gradientUnits="userSpaceOnUse" x1="914.1" y1="343.0" x2="850.0" y2="454.0"><stop offset="0" stop-color="#2E6FC8"/><stop offset="1" stop-color="#1A4E97"/></linearGradient>
    <linearGradient id="gt_web" gradientUnits="userSpaceOnUse" x1="1042.0" y1="306.0" x2="1042.0" y2="380.0"><stop offset="0" stop-color="#F0F0FF"/><stop offset="1" stop-color="#9EA9F6"/></linearGradient>
    <linearGradient id="gl_web" gradientUnits="userSpaceOnUse" x1="977.9" y1="343.0" x2="1042.0" y2="454.0"><stop offset="0" stop-color="#6E7CEC"/><stop offset="1" stop-color="#4A57D8"/></linearGradient>
    <linearGradient id="gr_web" gradientUnits="userSpaceOnUse" x1="1106.1" y1="343.0" x2="1042.0" y2="454.0"><stop offset="0" stop-color="#4A57D8"/><stop offset="1" stop-color="#2F39AE"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="946" cy="360" rx="360" ry="330" fill="url(#glowGold)" filter="url(#soft)"/>

  <!-- 悬浮阴影 -->
  <ellipse cx="946.0" cy="314.0" rx="60.9" ry="13" fill="#03050C" fill-opacity="0.42" filter="url(#soft)"/>
  <ellipse cx="850.0" cy="470.0" rx="60.9" ry="13" fill="#03050C" fill-opacity="0.42" filter="url(#soft)"/>
  <ellipse cx="1042.0" cy="470.0" rx="60.9" ry="13" fill="#03050C" fill-opacity="0.42" filter="url(#soft)"/>

  <!-- 磁力吸附特效线条（品字三连，绘制于立方体之下作为连接感）-->
  <path d="M 881.9 261.0 Q 884.0 302.0 914.1 343.0" fill="none" stroke="url(#magGrad)" stroke-width="2.4" opacity="0.7" filter="url(#soft2)"/>
  <circle cx="884.0" cy="302.0" r="4.2" fill="#FFF3D2" filter="url(#soft2)"/>
  <circle cx="884.0" cy="302.0" r="2" fill="#FFFDF6"/>
  <path d="M 1010.1 261.0 Q 1008.0 302.0 977.9 343.0" fill="none" stroke="url(#magGrad)" stroke-width="2.4" opacity="0.7" filter="url(#soft2)"/>
  <circle cx="1008.0" cy="302.0" r="4.2" fill="#FFF3D2" filter="url(#soft2)"/>
  <circle cx="1008.0" cy="302.0" r="2" fill="#FFFDF6"/>
  <path d="M 914.1 343.0 Q 946.0 343.0 977.9 343.0" fill="none" stroke="url(#magGrad)" stroke-width="2.4" opacity="0.7" filter="url(#soft2)"/>
  <circle cx="946.0" cy="343.0" r="4.2" fill="#FFF3D2" filter="url(#soft2)"/>
  <circle cx="946.0" cy="343.0" r="2" fill="#FFFDF6"/>

  <!-- 三个半透明立方体：Keystore / WebDAV 在底，Local 在顶（品字形） -->
  <g>
    <polygon points="785.9,343.0 850.0,380.0 850.0,454.0 785.9,417.0" fill="url(#gl_key)" fill-opacity="0.78" stroke="#2E6FC8" stroke-opacity="0.35" stroke-width="1"/>
    <polygon points="914.1,343.0 850.0,380.0 850.0,454.0 914.1,417.0" fill="url(#gr_key)" fill-opacity="0.80" stroke="#1A4E97" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="850.0,306.0 914.1,343.0 850.0,380.0 785.9,343.0" fill="url(#gt_key)" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
    <polygon points="842.3,310.4 814.8,326.4 814.8,359.6 842.3,375.6" fill="#FFFFFF" fill-opacity="0.18"/>
    <polyline points="785.9,343.0 850.0,306.0 914.1,343.0" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="850.0" y1="380.0" x2="850.0" y2="454.0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <text x="850.0" y="422.9" text-anchor="middle" font-family="'Segoe UI Semibold','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="0.6" fill="#FFFFFF" style="paint-order:stroke" stroke="#0A1B3A" stroke-width="2.4" stroke-opacity="0.35">Keystore</text>
  </g>
  <g>
    <polygon points="977.9,343.0 1042.0,380.0 1042.0,454.0 977.9,417.0" fill="url(#gl_web)" fill-opacity="0.78" stroke="#4A57D8" stroke-opacity="0.35" stroke-width="1"/>
    <polygon points="1106.1,343.0 1042.0,380.0 1042.0,454.0 1106.1,417.0" fill="url(#gr_web)" fill-opacity="0.80" stroke="#2F39AE" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="1042.0,306.0 1106.1,343.0 1042.0,380.0 977.9,343.0" fill="url(#gt_web)" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
    <polygon points="1034.3,310.4 1006.8,326.4 1006.8,359.6 1034.3,375.6" fill="#FFFFFF" fill-opacity="0.18"/>
    <polyline points="977.9,343.0 1042.0,306.0 1106.1,343.0" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="1042.0" y1="380.0" x2="1042.0" y2="454.0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <text x="1042.0" y="422.9" text-anchor="middle" font-family="'Segoe UI Semibold','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="0.6" fill="#FFFFFF" style="paint-order:stroke" stroke="#0A1B3A" stroke-width="2.4" stroke-opacity="0.35">WebDAV</text>
  </g>
  <g>
    <polygon points="881.9,187.0 946.0,224.0 946.0,298.0 881.9,261.0" fill="url(#gl_loc)" fill-opacity="0.78" stroke="#2E9BC2" stroke-opacity="0.35" stroke-width="1"/>
    <polygon points="1010.1,187.0 946.0,224.0 946.0,298.0 1010.1,261.0" fill="url(#gr_loc)" fill-opacity="0.80" stroke="#16708F" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="946.0,150.0 1010.1,187.0 946.0,224.0 881.9,187.0" fill="url(#gt_loc)" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
    <polygon points="938.3,154.4 910.8,170.3 910.8,203.7 938.3,219.6" fill="#FFFFFF" fill-opacity="0.18"/>
    <polyline points="881.9,187.0 946.0,150.0 1010.1,187.0" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="946.0" y1="224.0" x2="946.0" y2="298.0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <text x="946.0" y="266.9" text-anchor="middle" font-family="'Segoe UI Semibold','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="0.6" fill="#FFFFFF" style="paint-order:stroke" stroke="#0A1B3A" stroke-width="2.4" stroke-opacity="0.35">Local</text>
  </g>

  <text x="92" y="300" font-family="'Segoe UI Semibold','Segoe UI',system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="96" font-weight="800" letter-spacing="1"><tspan fill="#FFFFFF">bas</tspan><tspan fill="#F5B942">tion</tspan></text>
  <rect x="96" y="324" width="132" height="5" rx="2.5" fill="#F5B942"/>
  <text x="94" y="372" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="500" fill="#8899B5" letter-spacing="2">本地优先 · 零知识 · 开源的 Android 密码管理器</text>
  <text x="94" y="430" font-family="'Segoe UI Semibold','Segoe UI',system-ui,sans-serif" font-size="32" font-weight="700" fill="#EAF2FB">你的密码，只属于你。</text>
  <text x="94" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#8FA6C0" letter-spacing="1">AES-256-GCM · 硬件 Keystore · 完全离线运行</text>
</svg>
