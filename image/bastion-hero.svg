<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bastion — 本地优先 · 零知识 · 开源的 Android 密码管理器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1336"/><stop offset="0.55" stop-color="#070C22"/><stop offset="1" stop-color="#04060F"/></linearGradient>
    <radialGradient id="halo" cx="72%" cy="46%" r="60%"><stop offset="0" stop-color="#F5B942" stop-opacity="0.18"/><stop offset="45%" stop-color="#2E7CC8" stop-opacity="0.16"/><stop offset="100%" stop-color="#2E7CC8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F5B942" stop-opacity="0.55"/><stop offset="100%" stop-color="#F5B942" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#57C7E8" stop-opacity="0.45"/><stop offset="100%" stop-color="#57C7E8" stop-opacity="0"/></radialGradient>
