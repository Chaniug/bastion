<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bastion — 本地优先 · 零知识 · 开源的 Android 密码管理器">
  <defs>
    <!-- 背景渐变：深空蓝紫 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="35%" stop-color="#0D1137"/>
      <stop offset="65%" stop-color="#0F1A3A"/>
      <stop offset="100%" stop-color="#0B122E"/>
    </linearGradient>

    <!-- 弥散光晕 — 右上金色 -->
    <radialGradient id="haloGold" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F5B942" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#F5B942" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>

    <!-- 弥散光晕 — 右下蓝色 -->
    <radialGradient id="haloBlue" cx="60%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#5FB0F2" stop-opacity="0.20"/>
      <stop offset="40%" stop-color="#2E7CC8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2E7CC8" stop-opacity="0"/>
    </radialGradient>

    <!-- 弥散光晕 — 左侧紫色 -->
    <radialGradient id="haloPurple" cx="15%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 盾牌主体渐变 -->
    <linearGradient id="shieldBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2A5E"/>
      <stop offset="50%" stop-color="#152250"/>
      <stop offset="100%" stop-color="#0E1838"/>
    </linearGradient>

    <!-- 盾牌高光 -->
    <linearGradient id="shieldHighlight" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#9FD4FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5FB0F2" stop-opacity="0.02"/>
    </linearGradient>

    <!-- 锁孔金色渐变 -->
    <linearGradient id="keyholeGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE6A8"/>
      <stop offset="30%" stop-color="#F5B942"/>
      <stop offset="70%" stop-color="#E5A820"/>
      <stop offset="100%" stop-color="#C8860A"/>
    </linearGradient>

    <!-- 锁孔发光 -->
    <radialGradient id="keyholeGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFE6A8" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#F5B942" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>

    <!-- 网格图案 -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#9FD4FF" stroke-opacity="0.04" stroke-width="0.8"/>
    </pattern>

    <!-- 噪点纹理 -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>

    <!-- 高斯模糊 -->
    <filter id="blurLg">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blurMd">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurSm">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- 盾牌投影 -->
    <filter id="shieldShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="28" flood-color="#0A0E27" flood-opacity="0.6"/>
    </filter>

    <!-- 锁孔发光滤镜 -->
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 数据流粒子渐变 -->
    <linearGradient id="particleBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FD4FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5FB0F2" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 品牌文字渐变 -->
    <linearGradient id="textGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5B942"/>
      <stop offset="50%" stop-color="#FFD874"/>
      <stop offset="100%" stop-color="#F5B942"/>
    </linearGradient>

    <!-- 裁剪路径 -->
    <clipPath id="shieldClip">
      <path d="M170 220 L170 340 C170 370 190 400 250 430 L330 460 L410 430 C470 400 490 370 490 340 L490 220 L330 170 Z"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- 弥散光晕 -->
  <rect width="1280" height="640" fill="url(#haloGold)"/>
  <rect width="1280" height="640" fill="url(#haloBlue)"/>
  <rect width="1280" height="640" fill="url(#haloPurple)"/>

  <!-- 网格 -->
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- ==================== 右侧视觉区：盾牌 + 锁孔 ==================== -->
  <g transform="translate(780, 80)">
    <!-- 大光晕 -->
    <ellipse cx="230" cy="260" rx="200" ry="200" fill="url(#keyholeGlow)" filter="url(#blurLg)" opacity="0.5"/>
    <ellipse cx="230" cy="260" rx="120" ry="120" fill="url(#keyholeGlow)" filter="url(#blurMd)" opacity="0.4"/>

    <!-- 环绕轨道线（装饰） -->
    <g opacity="0.15" stroke="#9FD4FF" stroke-width="0.8" fill="none">
      <ellipse cx="230" cy="260" rx="170" ry="170" stroke-dasharray="8 12" transform="rotate(-15,230,260)"/>
      <ellipse cx="230" cy="260" rx="190" ry="130" stroke-dasharray="5 16" transform="rotate(25,230,260)"/>
    </g>

    <!-- 数据粒子点 -->
    <g>
      <circle cx="60" cy="260" r="2.5" fill="#9FD4FF" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="180" r="2" fill="#FFE6A8" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="380" cy="340" r="2.5" fill="#5FB0F2" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="350" r="1.8" fill="#7C4DFF" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="260" r="1.5" fill="#FFE6A8" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ====== 盾牌 ====== -->
    <g filter="url(#shieldShadow)">
      <!-- 盾牌主体 -->
      <path d="M120 200 L120 370 C120 410 145 450 230 490 L340 530 L450 490 C535 450 560 410 560 370 L560 200 L340 140 Z"
            fill="url(#shieldBody)" stroke="#2E5CA8" stroke-opacity="0.4" stroke-width="1.5"/>

      <!-- 盾牌内发光边 -->
      <path d="M132 210 L132 365 C132 400 154 435 230 472 L340 510 L450 472 C526 435 548 400 548 365 L548 210 L340 152 Z"
            fill="none" stroke="#5FB0F2" stroke-opacity="0.12" stroke-width="1"/>

      <!-- 盾牌高光层 -->
      <path d="M120 200 L120 370 C120 410 145 450 230 490 L340 530 L450 490 C535 450 560 410 560 370 L560 200 L340 140 Z"
            fill="url(#shieldHighlight)"/>

      <!-- 盾牌顶部截面高光 -->
      <path d="M120 200 L340 140 L560 200" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2"/>

      <!-- 玻璃反光条（左） -->
      <path d="M145 220 L145 350 C145 380 165 410 220 440 L280 468" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- ====== 锁孔 ====== -->
    <g>
      <!-- 锁孔外发光 -->
      <circle cx="340" cy="370" r="28" fill="url(#keyholeGlow)" filter="url(#glowFilter)" opacity="0.8"/>

      <!-- 锁孔圆环 -->
      <circle cx="340" cy="370" r="22" fill="none" stroke="url(#keyholeGold)" stroke-width="4" opacity="0.9"/>

      <!-- 锁孔圆形填充 -->
      <circle cx="340" cy="370" r="18" fill="#0E1838"/>

      <!-- 锁孔内部高光 -->
      <circle cx="340" cy="370" r="14" fill="url(#keyholeGlow)" opacity="0.5"/>

      <!-- 锁孔方形延伸 -->
      <path d="M326 378 L354 378 L354 412 L326 412 Z" fill="#0E1838" rx="2"/>
      <path d="M326 378 L354 378 L354 412 L326 412 Z" fill="none" stroke="url(#keyholeGold)" stroke-width="3" opacity="0.85"/>
      <rect x="331" y="382" width="18" height="26" rx="1" fill="url(#keyholeGlow)" opacity="0.35"/>

      <!-- 锁孔底部圆角 -->
      <path d="M329 410 A7 7 0 0 0 343 410 L351 410 A7 7 0 0 0 337 410" fill="none" stroke="url(#keyholeGold)" stroke-width="2.5" opacity="0.7"/>
    </g>

    <!-- ====== 加密数据流线 ====== -->
    <g opacity="0.25">
      <path d="M200 300 Q270 290 340 350" fill="none" stroke="#5FB0F2" stroke-width="0.8" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M440 290 Q390 320 360 370" fill="none" stroke="#FFE6A8" stroke-width="0.8" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M300 470 Q330 430 340 395" fill="none" stroke="#7C4DFF" stroke-width="0.8" stroke-dasharray="3 9">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- ==================== 左侧文字区 ==================== -->
  <g transform="translate(72, 0)">
    <!-- 小标签 pill -->
    <rect x="0" y="185" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#9FD4FF" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="20" cy="201" r="4" fill="#5FB0F2"/>
    <text x="36" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#9FD4FF" letter-spacing="2">本地优先 · 零知识 · 开源</text>

    <!-- 主标题 — 品牌名 -->
    <text x="0" y="272" font-family="'Sora','Segoe UI Semibold','PingFang SC','Microsoft YaHei',sans-serif" font-size="88" font-weight="800" letter-spacing="1.5">
      <tspan fill="#FFFFFF">bas</tspan><tspan fill="url(#textGold)">tion</tspan>
    </text>

    <!-- 下划线装饰 -->
    <rect x="0" y="292" width="120" height="4.5" rx="2.25" fill="url(#textGold)" opacity="0.85"/>

    <!-- 副标题 -->
    <text x="0" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#8899B5" letter-spacing="1.5">把密码锁进你自己的堡垒</text>

    <!-- 三行特性 -->
    <g transform="translate(0, 398)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="18" cy="18" r="3.5" fill="#5FB0F2"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9BBD0">AES-256-GCM 端到端加密</text>
    </g>
    <g transform="translate(0, 442)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="18" cy="18" r="3.5" fill="#F5B942"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9BBD0">硬件 Keystore（TEE）安全隔离</text>
    </g>
    <g transform="translate(0, 486)">
      <rect x="0" y="0" width="300" height="36" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="18" cy="18" r="3.5" fill="#7C4DFF"/>
      <text x="32" y="24" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#A9BBD0">完全离线 · 无需网络权限</text>
    </g>

    <!-- 底部标签 -->
    <g transform="translate(0, 548)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#5FB0F2" fill-opacity="0.1" stroke="#5FB0F2" stroke-opacity="0.25"/>
      <text x="14" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#9FD4FF">Android 17</text>

      <rect x="122" y="0" width="136" height="28" rx="14" fill="#F5B942" fill-opacity="0.1" stroke="#F5B942" stroke-opacity="0.25"/>
      <text x="136" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#FFE6A8">Bitwarden 兼容</text>

      <rect x="268" y="0" width="130" height="28" rx="14" fill="#7C4DFF" fill-opacity="0.1" stroke="#7C4DFF" stroke-opacity="0.25"/>
      <text x="282" y="19" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#B39DDB">KeePass 兼容</text>
    </g>
  </g>

  <!-- 噪点纹理覆盖（极淡） -->
  <rect width="1280" height="640" fill="#0A0E27" opacity="0.03" style="mix-blend-mode: overlay"/>
</svg>
