[versions]
# 2026-08 全量依赖升级批次。
# AGP 9.1.1 → 9.3.2，对应最低 Gradle 9.5.0（见 gradle-wrapper.properties）。
# 注意：AGP 9.1 / 9.2 / 9.3 内置的 KGP 均为 2.2.10，本项目用下面的 kotlin 变量显式声明
# 2.3.21 将其覆盖，所以升 AGP 不会动 Kotlin，KSP 2.3.11 的配对关系保持不变。
agp = "9.3.2"
# Kotlin 停在 2.3.21（已是 2.3 线最新）。升 2.4.10 被 KSP 阻塞：
# KSP 至今只发到 2.3.11，没有 2.4.x，Room 编译器跑不起来。待 KSP 2.4 发布后再动。
kotlin = "2.3.21"
# KSP 已改为单号版本体系：2.3.x 线对应 Kotlin 2.3（Kotlin 2.4 的 KSP 尚未发布）。
ksp = "2.3.11"
coreKtx = "1.19.0"
kotlinxSerialization = "1.11.0"
junit = "4.13.2"  # JUnit 4 的最终版本，无更高版本
junitVersion = "1.3.0"
mockk = "1.14.11"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.03.00"
# 刻意保留 1.5.0-alpha16：刚用 MotionScheme.standard() 修掉 Expressive 回弹导致的
# 底部导航切 tab 图标闪烁。alpha 线版本间 motion 行为会变，升 alpha27 有复发风险；
# 而最新稳定版 1.4.0 比 alpha 线更旧，回退会丢 Expressive 特性。
material3Expressive = "1.5.0-alpha16"
navigation = "2.10.0"
room = "2.8.4"
# 刻意保留 1.2.0-alpha05：最新稳定版 1.1.0 比它更旧，没有"更新的稳定版"可升；
# 生物识别关系解锁路径，alpha 线跨 2 个 minor（→1.4.0-alpha07）风险不划算。
biometric = "1.2.0-alpha05"
securityCrypto = "1.1.0"  # alpha06 → 1.1.0 稳定版
viewModel = "2.11.0"
coroutines = "1.11.0"
datastore = "1.2.1"
zxing = "3.5.4"
zxingAndroidEmbedded = "4.3.0"
camerax = "1.6.2"
permissions = "0.37.3"
commonmark = "0.30.0"
splashscreen = "1.2.0"
scrypt = "1.4.0"
fragment = "1.9.0"
material = "1.14.0"
autofill = "1.3.0"  # beta01 → 1.3.0 稳定版
slice = "1.1.0-alpha02"  # 上游已停更，无更高版本
playServicesAuth = "22.0.0"
# 此变量此前是死配置：app/build.gradle 里 credentials 走硬编码 1.3.0，从未引用 catalog。
# 本次统一改回 catalog 引用（见 app/build.gradle），版本一并从 1.3.0 提到 1.6.0。
credentials = "1.6.0"
work = "2.11.2"
reorderable = "3.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }  # 添加splashscreen库
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Expressive" }
androidx-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3Expressive" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Room Database
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# Biometric
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Security
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# ViewModel
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "viewModel" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }

# Coroutines
kotlin-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Material Icons Extended
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# TOTP and QR Code
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }

# Camera
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Permissions
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "permissions" }
accompanist-drawablepainter = { group = "com.google.accompanist", name = "accompanist-drawablepainter", version.ref = "permissions" }

# Kotlinx Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Markdown
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
# vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }  # Disabled

# Scrypt for Aegis decryption
scrypt = { group = "com.lambdaworks", name = "scrypt", version.ref = "scrypt" }

# Fragment and Material Components for BottomSheet
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Autofill and Slice for InlinePresentation
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
androidx-slice-core = { group = "androidx.slice", name = "slice-core", version.ref = "slice" }
androidx-slice-builders = { group = "androidx.slice", name = "slice-builders", version.ref = "slice" }

# Google Play Services for SMS Retriever API
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# Credential Manager for Passkeys (Android 14+)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }

# WorkManager for auto backup
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Reorderable for drag-and-drop sorting
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Phase A：AGP 9 内置 Kotlin 取代 kotlin-android，该插件不再使用（保留 compose/serialization/parcelize/ksp）。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
