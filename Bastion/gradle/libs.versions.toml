[versions]
agp = "9.1.1"
# Phase A：AGP 9.1.1 要求 Kotlin ≥ 2.3（官方兼容表：Kotlin 2.2 仅支持 AGP 7.3.1–8.10，
# 2.3 需 AGP ≥ 9.0.28）。故从方案 A 原定的 2.2.0 升到 2.3.21。
kotlin = "2.3.21"
# KSP 已改为单号版本体系：2.3.x 线对应 Kotlin 2.3（Kotlin 2.4 的 KSP 尚未发布）。
ksp = "2.3.11"
coreKtx = "1.10.1"
# kotlinx-serialization 1.8.1：与 Kotlin 2.3 兼容（1.6.0 偏旧，2.3 建议 ≥ 1.7）
kotlinxSerialization = "1.8.1"
junit = "4.13.2"
junitVersion = "1.2.1"
# mockk 1.14.0：本项目已升到 kotlin = 2.3.21，mockk 1.14.x 由 Kotlin 2.3 编译，
# metadata 2.3 与 2.3.21 编译器对齐（原 1.13.17 由 2.0 编译，迁 2.3 后需同步升级）。
mockk = "1.14.0"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2026.03.00"
material3Expressive = "1.5.0-alpha16"
navigation = "2.8.9"
# D.3 Room 升级：2.6.1 → 2.7.1（KSP 支持更好、编译更快；2.7 原生支持 SELECT 投影到非 @Entity data class，为 C.3 投影铺路）
room = "2.7.1"
biometric = "1.2.0-alpha05"
securityCrypto = "1.1.0-alpha06"
viewModel = "2.8.7"
# D.1 协程对齐：1.7.3 → 1.9.0（Kotlin 2.0 时代应配 1.8+/1.9，API 稳定无明显 breaking）
coroutines = "1.9.0"
# D.2 DataStore 对齐：1.0.0 → 1.1.7（1.1.x 性能/bug 修复，context.dataStore API 无 breaking）
datastore = "1.1.7"
zxing = "3.5.3"
zxingAndroidEmbedded = "4.3.0"
camerax = "1.5.3"
permissions = "0.32.0"
commonmark = "0.22.0"
splashscreen = "1.0.1"  # 添加splashscreen版本
scrypt = "1.4.0"
fragment = "1.6.2"  # Fragment for BottomSheetDialogFragment
material = "1.11.0"  # Google Material Components
autofill = "1.2.0-beta01"  # Autofill framework for InlinePresentation
slice = "1.1.0-alpha02"  # Slice for inline UI
playServicesAuth = "21.5.1"  # Google Play Services Auth for SMS Retriever API and Google authorization
credentials = "1.2.2"  # Credential Manager for Passkeys (Android 14+)
work = "2.8.1"  # WorkManager for auto backup
reorderable = "3.0.0"  # Compose Reorderable for drag-and-drop sorting

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }  # 添加splashscreen库
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Expressive" }
androidx-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3Expressive" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Room Database
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# Biometric
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Security
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# ViewModel
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "viewModel" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }

# Coroutines
kotlin-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Material Icons Extended
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# TOTP and QR Code
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }

# Camera
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Permissions
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "permissions" }
accompanist-drawablepainter = { group = "com.google.accompanist", name = "accompanist-drawablepainter", version.ref = "permissions" }

# Kotlinx Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Markdown
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
# vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }  # Disabled

# Scrypt for Aegis decryption
scrypt = { group = "com.lambdaworks", name = "scrypt", version.ref = "scrypt" }

# Fragment and Material Components for BottomSheet
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Autofill and Slice for InlinePresentation
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
androidx-slice-core = { group = "androidx.slice", name = "slice-core", version.ref = "slice" }
androidx-slice-builders = { group = "androidx.slice", name = "slice-builders", version.ref = "slice" }

# Google Play Services for SMS Retriever API
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# Credential Manager for Passkeys (Android 14+)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }

# WorkManager for auto backup
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Reorderable for drag-and-drop sorting
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Phase A：AGP 9 内置 Kotlin 取代 kotlin-android，该插件不再使用（保留 compose/serialization/parcelize/ksp）。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
