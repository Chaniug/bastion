plugins {
    alias(libs.plugins.android.application)
    // Phase A（AGP 9.1.1）：内置 Kotlin 已取代 kotlin-android 插件，
    // 显式 apply org.jetbrains.kotlin.android 会与内置 Kotlin 的 kotlin extension 冲突
    // （Cannot add extension with name 'kotlin'）。故移除，Android 模块默认可用 Kotlin。
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    id 'kotlin-parcelize'
}

android {
    namespace 'com.bastion.app'
    compileSdk 37

    def previewVersionSuffix = project.findProperty('previewVersionSuffix')?.toString()?.trim()
    // commit_count 仍用于 preview 构建（反映开发进度）；release 跟随 git tag（与 GitHub Release 名一致）
    def gitCommitCount = 0
    try {
        gitCommitCount = ['git', 'rev-list', '--count', 'HEAD'].execute([], rootDir).text.trim().toInteger()
    } catch (ignored) {
        gitCommitCount = 0
    }
    // 尝试精确匹配当前 HEAD 上的 tag；命中则用 tag 作 versionName（如 v1.0.307 → 1.0.307），
    // 与 GitHub Release 名对齐；不命中（无 tag / 非 release 分支）走 commit_count fallback。
    def exactTag = ''
    try {
        exactTag = ['git', 'describe', '--tags', '--exact-match', 'HEAD'].execute([], rootDir).text.trim()
    } catch (ignored) {
        exactTag = ''
    }
    def appVersionCode
    def baseVersionName
    if (previewVersionSuffix) {
        // preview 构建：保留 commit_count + 时间戳后缀 + epoch 秒 versionCode（保证严格递增）
        appVersionCode = (System.currentTimeMillis() / 1000L).toInteger()
        baseVersionName = "1.0.${gitCommitCount}-${previewVersionSuffix}"
    } else if (exactTag && exactTag.startsWith('v')) {
        // release 构建：HEAD 上有 tag，用 tag 名作 versionName（如 v1.0.307 → 1.0.307）
        baseVersionName = exactTag.substring(1)
        def parts = baseVersionName.split('\\.')
        try {
            int major = parts.length > 0 ? parts[0].toInteger() : 0
            int minor = parts.length > 1 ? parts[1].toInteger() : 0
            int patch = parts.length > 2 ? parts[2].toInteger() : 0
            appVersionCode = major * 1000000 + minor * 1000 + patch
        } catch (ignored) {
            appVersionCode = (System.currentTimeMillis() / 1000L).toInteger()
        }
    } else {
        // fallback（如本地构建无 tag）：保持 commit_count 机制
        appVersionCode = (System.currentTimeMillis() / 1000L).toInteger()
        baseVersionName = "1.0.${gitCommitCount}"
    }
    def normalizeTwoDigits = { raw ->
        def value = raw?.toString()?.trim()?.replaceAll('\\D', '')
        if (!value) {
            return '01'
        }
        value = value.padLeft(2, '0')
        value.length() > 2 ? value[-2..-1] : value
    }

    def sanitizeTag = { raw, fallback ->
        def value = raw?.toString()?.trim()
        if (!value) {
            return fallback
        }
        def cleaned = value.replaceAll('[^0-9A-Za-z._+-]', '_')
        cleaned ?: fallback
    }

    def resolveArchTag = { output ->
        def manualArch = project.findProperty('apkArch')
        if (manualArch?.toString()?.trim()) {
            return sanitizeTag(manualArch, 'universal')
        }

        if (output?.metaClass?.respondsTo(output, 'getFilters')) {
            def abiFilter = output.filters?.find {
                def typeText = it?.filterType?.toString()
                typeText?.equalsIgnoreCase('ABI') || typeText?.toUpperCase()?.endsWith('.ABI')
            }
            if (abiFilter?.identifier?.toString()?.trim()) {
                return sanitizeTag(abiFilter.identifier, 'universal')
            }
        }

        def configuredAbis = defaultConfig.ndk?.abiFilters
        if (configuredAbis && !configuredAbis.isEmpty()) {
            return sanitizeTag(configuredAbis.toList().sort().join('+'), 'universal')
        }

        'universal'
    }

    def findNextDailySeqForVersion = { String versionNameTag, String dateTag, String versionTag ->
        def versionPrefix = "${versionNameTag}-${dateTag}${versionTag}"
        def apkNamePattern = java.util.regex.Pattern.compile('^Bastion-Android-.+-' + java.util.regex.Pattern.quote(versionPrefix) + '-(\\d{2})\\.[aA][pP][kK]$')
        def maxSeq = 0

        def outputsDir = file("$buildDir/outputs/apk")
        if (outputsDir.exists()) {
            outputsDir.eachFileRecurse { outputFile ->
                if (!outputFile.isFile()) {
                    return
                }
                def matcher = apkNamePattern.matcher(outputFile.name)
                if (matcher.matches()) {
                    def seq = matcher.group(1).toInteger()
                    if (seq > maxSeq) {
                        maxSeq = seq
                    }
                }
            }
        }

        maxSeq + 1
    }

    def buildDateTag = new Date().format('yyMMdd', java.util.TimeZone.getTimeZone('Asia/Shanghai'))
    def buildVersionTag = normalizeTwoDigits(project.findProperty('apkVersionTag') ?: appVersionCode)
    def manualDailySeq = project.findProperty('dailySeq')
    def buildDailySeq = manualDailySeq != null
            ? normalizeTwoDigits(manualDailySeq)
            : normalizeTwoDigits(findNextDailySeqForVersion(baseVersionName, buildDateTag, buildVersionTag))
    def fullVersionName = "${baseVersionName}-${buildDateTag}${buildVersionTag}-${buildDailySeq}"

    defaultConfig {
        applicationId "com.bastion.app"
        minSdk 26
        // Phase A 跨代升级：targetSdk 35 → 37（Android 17 行为变更适配）
        // AGP 9.1.1 + Gradle 9.3.1 + Kotlin 2.2（工具链级联升级，越过原 Phase D 红线）
        // 已在 AndroidManifest 合规：前台服务 specialUse + PROPERTY_SPECIAL_USE_FGS_SUBTYPE
        // + FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE 权限齐全；无 native 库，16KB 页面无影响
        targetSdk 37
        versionCode appVersionCode
        versionName baseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        // 阶段二·流畅性与构建：仅保留应用实际支持的语言（默认 values=英文 + values-zh=中文），
        // 砍掉 AAPT 默认打入的其余 80+ 冗余语言资源，降低包体与常驻资源内存。
        resConfigs "en", "zh"
        // 单测中 android.util.Log 等未 mock 框架方法返回默认值而非抛异常，
        // 避免历史单测因 "Method ... not mocked" 失败导致 CI 假绿（exit code 1 误导标注）。
        testOptions {
            unitTests.returnDefaultValues = true
        }

        def gitSha = 'unknown'
        try {
            gitSha = ['git', 'rev-parse', '--short', 'HEAD'].execute([], rootDir).text.trim()
        } catch (ignored) {}
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        buildConfigField 'String', 'BUILD_TIME', "\"${new Date().format('yyyy-MM-dd HH:mm:ss z')}\""
        buildConfigField 'String', 'FULL_VERSION_NAME', "\"${fullVersionName}\""
        buildConfigField 'String', 'BUILD_DETAIL_TAG', "\"${buildDateTag}${buildVersionTag}-${buildDailySeq}\""
        buildConfigField 'int', 'BW_DIAG_SCHEMA', '1'
        
    }

    // CI 固定签名：当注入 BASTION_KS_FILE 时，debug 与 release 共用同一 keystore，
    // 使 preview debug APK 与 stable release APK 签名一致，可互相覆盖安装。
    // 本地开发不设这些环境变量，仍走 Android 默认 debug keystore，无副作用。
    // 仅在真正注入非空(非空白) keystore 路径时才启用固定签名；
    // 否则（workflow_dispatch / pull_request / 本地开发）回退到 Android 默认 debug keystore，
    // 避免构建因占位文件 nonexistent.jks 不存在而失败。
    def ksFile = System.getenv('BASTION_KS_FILE')?.trim()
    signingConfigs {
        ciFixed {
            storeFile file(ksFile ?: 'nonexistent.jks')
            storePassword System.getenv('BASTION_KS_STORE_PASSWORD')?.trim() ?: ''
            keyAlias System.getenv('BASTION_KS_ALIAS')?.trim() ?: ''
            keyPassword System.getenv('BASTION_KS_KEY_PASSWORD')?.trim() ?: ''
        }
    }

    splits {
        abi {
            // 仅输出 arm64-v8a（64 位）APK，砍掉 armeabi-v7a（32 位）以缩短构建并精简产物。
            // 现代设备几乎均为 64 位；仅极少数老旧 32 位设备不再支持。
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        release {
            // 默认开启混淆与资源压缩（Stable 正式构建走此路径）。
            // CI 的 Preview 构建通过 -PpreviewMinify=false 关闭混淆以大幅加速，
            // 不影响发布产物的安全性与体积。
            def disableMinify = project.findProperty('previewMinify')?.toString()?.trim()?.equalsIgnoreCase('false')
            minifyEnabled !disableMinify
            shrinkResources !disableMinify
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            // 仅当注入了非空 keystore 路径时才应用固定签名，确保 debug 与 stable 签名一致可互相覆盖；
            // 否则（如 workflow_dispatch / pull_request / 本地）使用默认 debug keystore，构建不被签名卡住。
            if (ksFile) {
                signingConfig signingConfigs.ciFixed
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }


    // Phase A（AGP 9）：applicationVariants / libraryVariants / testVariants / unitTestVariants
    // 等旧 variant 扩展点已被 AGP 9 移除（见 AGP 9.0 发行说明），上面的 APK 输出文件名
    // 自定义重命名逻辑因此失效。AGP 9 下不能在 onVariants 里直接写 outputFileName
    // （新 VariantOutput 仅暴露 versionCode/versionName/outputType），官方推荐的「重命名 APK」
    // 方式是 androidComponents + SingleArtifact.APK 的 listenToArtifacts 机制（自定义 Copy
    // 任务 + BuiltArtifacts 元数据）。为尽快让构建门进入真正的编译阶段并产出可真机验证的
    // preview 包，此处先移除失效块，自定义命名（Bastion-Android-*.APK）留作后续用正确方式还原，
    // 还原方案见仓库 /docs/phaseA-apk-rename-restore.md。CI 的 APK 收集通配符（*.apk/*.APK）
    // 对默认命名 app-arm64-v8a-debug.apk 同样生效，不影响出包与发布。

    sourceSets {
        test {
            java {
                // Legacy autofill tests target removed APIs and currently block unit-test compilation.
                // Keep them isolated until the Autofill test suite is rebuilt against current architecture.
                exclude 'com/bastion/app/autofill/**'
            }
        }
    }
    lint {
        baseline = file('lint-baseline.xml')
        // [navigation 2.10 升级过渡项] 2.10 传递升级 compose-ui，其新 lint 规则引入
        // 大量新问题（首个为 NonObservableLocale）。本地无 Android SDK，无法重新生成
        // lint-baseline.xml 吸收这些新问题，故暂时关闭 abortOnError 保证 dev 出包；
        // 待 CI 跑 lint 重新生成 baseline 覆盖这些新问题后，再移除本项。
        abortOnError false
        // Workaround: lint/lifecycle detector crashes with Kotlin 2.x analysis API in current toolchain.
        disable 'NullSafeMutableLiveData',
                'FrequentlyChangingValue',
                'RememberInComposition',
                'FlowOperatorInvokedInComposition',
                'UnrememberedMutableState',
                'AutoboxingStateCreation',
                'CoroutineCreationDuringComposition',
                'StateFlowValueCalledInComposition',
                'ProduceStateDoesNotAssignValue',
                'MissingTranslation'
        // Avoid scanning dependency-provided lint registries; one of them intermittently
        // crashes ASM migration with NegativeArraySizeException in lintVitalAnalyzeRelease.
        checkDependencies false
        // lintVital still loads dependency registries even when checkDependencies is false.
        // Disable the broken release gate so Android Studio's normal assembleRelease works.
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

// Phase A（AGP 9 内置 Kotlin）：kotlin extension 由 AGP 9 内置提供，
// 编译器选项与 Compose 编译器报告在此顶层 kotlin {} 块配置。
kotlin {
    compilerOptions {
        // Kotlin 2.2：compilerOptions.jvmTarget 要求 JvmTarget 枚举，
        // 不再接受 Gradle 的 JavaVersion（否则报 Cannot convert ... JavaVersion to JvmTarget）
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
    // 架构升级 C.6（第 1 步）：开启 Compose 编译器稳定性/指标报告。
    // 报告输出到 app/build/compose_compiler/，用于定位被误判为「不稳定」的数据类，
    // 后续可针对性地添加 @Immutable / @Stable 注解以减少不必要重组。
    // 仅生成报告，不改变编译行为，不影响产物。
    composeCompiler {
        reportsDestination = layout.buildDirectory.dir("compose_compiler")
        // 2026-08-29：补开 metricsDestination。
        // reportsDestination 只给「每个 composable 的稳定性报告」（逐个函数），
        // metricsDestination 额外给「模块级汇总」：各类的 stable/unstable 统计、
        // composable 函数总数、可跳过（skippable）/可重启（restartable）比例。
        // 排查重组热点时先看 metrics 找 Top N，再回 reports 定位具体函数，效率高得多。
        // 此前报告生成在 runner 上即丢弃，已同步在 main.yml 里作为 artifact 上传。
        metricsDestination = layout.buildDirectory.dir("compose_metrics")
    }
}

// Kotlin / serialization 的 force 版本改为从 catalog 读取，消除双轨维护。
// 此前这里硬编码了 2.3.21 / 1.11.0，与 libs.versions.toml 的 kotlin / kotlinxSerialization
// 各写一遍：将来升 Kotlin 若只改 catalog，force 会把新版本压回旧版本，且症状隐蔽。
def kotlinVersion = libs.versions.kotlin.get()
def serializationVersion = libs.versions.kotlinxSerialization.get()

configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-bom:$kotlinVersion",
        "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion",
        "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlinVersion",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion",
        "org.jetbrains.kotlinx:kotlinx-serialization-bom:$serializationVersion",
        "org.jetbrains.kotlinx:kotlinx-serialization-core:$serializationVersion",
        "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:$serializationVersion",
        "org.jetbrains.kotlinx:kotlinx-serialization-json:$serializationVersion",
        "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:$serializationVersion"
    )
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-core:$serializationVersion")
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:$serializationVersion")
    }

    // Core Android libraries
    implementation libs.androidx.core.ktx
