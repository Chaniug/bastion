plugins {
    alias(libs.plugins.android.application)
    // Phase A（AGP 9.1.1）：内置 Kotlin 已取代 kotlin-android 插件，
    // 显式 apply org.jetbrains.kotlin.android 会与内置 Kotlin 的 kotlin extension 冲突
    // （Cannot add extension with name 'kotlin'）。故移除，Android 模块默认可用 Kotlin。
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    id 'kotlin-parcelize'
}

android {
    namespace 'com.bastion.app'
    compileSdk 37

    def previewVersionSuffix = project.findProperty('previewVersionSuffix')?.toString()?.trim()
    // versionCode 取当前 epoch 秒以保证每次构建严格大于上次（覆盖安装必须）
    def appVersionCode = (System.currentTimeMillis() / 1000L).toInteger()
    // 主版本号随每次 git 提交自动递增：patch 位取仓库提交总数，根治「版本号永远停在 1.0.297」。
    // 仍兼容 -PpreviewVersionSuffix=xxx 标记预览构建（如 1.0.839-preview）。
    def gitCommitCount = 0
    try {
        gitCommitCount = ['git', 'rev-list', '--count', 'HEAD'].execute([], rootDir).text.trim().toInteger()
    } catch (ignored) {
        gitCommitCount = 0
    }
    def baseVersionName = previewVersionSuffix ? "1.0.${gitCommitCount}-${previewVersionSuffix}" : "1.0.${gitCommitCount}"
    def normalizeTwoDigits = { raw ->
        def value = raw?.toString()?.trim()?.replaceAll('\\D', '')
        if (!value) {
            return '01'
        }
        value = value.padLeft(2, '0')
        value.length() > 2 ? value[-2..-1] : value
    }

    def sanitizeTag = { raw, fallback ->
        def value = raw?.toString()?.trim()
        if (!value) {
            return fallback
        }
        def cleaned = value.replaceAll('[^0-9A-Za-z._+-]', '_')
        cleaned ?: fallback
    }

    def resolveArchTag = { output ->
        def manualArch = project.findProperty('apkArch')
        if (manualArch?.toString()?.trim()) {
            return sanitizeTag(manualArch, 'universal')
        }

        if (output?.metaClass?.respondsTo(output, 'getFilters')) {
            def abiFilter = output.filters?.find {
                def typeText = it?.filterType?.toString()
                typeText?.equalsIgnoreCase('ABI') || typeText?.toUpperCase()?.endsWith('.ABI')
            }
            if (abiFilter?.identifier?.toString()?.trim()) {
                return sanitizeTag(abiFilter.identifier, 'universal')
            }
        }

        def configuredAbis = defaultConfig.ndk?.abiFilters
        if (configuredAbis && !configuredAbis.isEmpty()) {
            return sanitizeTag(configuredAbis.toList().sort().join('+'), 'universal')
        }

        'universal'
    }

    def findNextDailySeqForVersion = { String versionNameTag, String dateTag, String versionTag ->
        def versionPrefix = "${versionNameTag}-${dateTag}${versionTag}"
        def apkNamePattern = java.util.regex.Pattern.compile('^Bastion-Android-.+-' + java.util.regex.Pattern.quote(versionPrefix) + '-(\\d{2})\\.[aA][pP][kK]$')
        def maxSeq = 0

        def outputsDir = file("$buildDir/outputs/apk")
        if (outputsDir.exists()) {
            outputsDir.eachFileRecurse { outputFile ->
                if (!outputFile.isFile()) {
                    return
                }
                def matcher = apkNamePattern.matcher(outputFile.name)
                if (matcher.matches()) {
                    def seq = matcher.group(1).toInteger()
                    if (seq > maxSeq) {
                        maxSeq = seq
                    }
                }
            }
        }

        maxSeq + 1
    }

    def buildDateTag = new Date().format('yyMMdd', java.util.TimeZone.getTimeZone('Asia/Shanghai'))
    def buildVersionTag = normalizeTwoDigits(project.findProperty('apkVersionTag') ?: appVersionCode)
    def manualDailySeq = project.findProperty('dailySeq')
    def buildDailySeq = manualDailySeq != null
            ? normalizeTwoDigits(manualDailySeq)
            : normalizeTwoDigits(findNextDailySeqForVersion(baseVersionName, buildDateTag, buildVersionTag))
    def fullVersionName = "${baseVersionName}-${buildDateTag}${buildVersionTag}-${buildDailySeq}"

    defaultConfig {
        applicationId "com.bastion.app"
        minSdk 26
        // Phase A 跨代升级：targetSdk 35 → 37（Android 17 行为变更适配）
        // AGP 9.1.1 + Gradle 9.3.1 + Kotlin 2.2（工具链级联升级，越过原 Phase D 红线）
        // 已在 AndroidManifest 合规：前台服务 specialUse + PROPERTY_SPECIAL_USE_FGS_SUBTYPE
        // + FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE 权限齐全；无 native 库，16KB 页面无影响
        targetSdk 37
        versionCode appVersionCode
        versionName baseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        // 阶段二·流畅性与构建：仅保留应用实际支持的语言（默认 values=英文 + values-zh=中文），
        // 砍掉 AAPT 默认打入的其余 80+ 冗余语言资源，降低包体与常驻资源内存。
        resConfigs "en", "zh"
        // 单测中 android.util.Log 等未 mock 框架方法返回默认值而非抛异常，
        // 避免历史单测因 "Method ... not mocked" 失败导致 CI 假绿（exit code 1 误导标注）。
        testOptions {
            unitTests.returnDefaultValues = true
        }

        def gitSha = 'unknown'
        try {
            gitSha = ['git', 'rev-parse', '--short', 'HEAD'].execute([], rootDir).text.trim()
        } catch (ignored) {}
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        buildConfigField 'String', 'BUILD_TIME', "\"${new Date().format('yyyy-MM-dd HH:mm:ss z')}\""
        buildConfigField 'String', 'FULL_VERSION_NAME', "\"${fullVersionName}\""
        buildConfigField 'String', 'BUILD_DETAIL_TAG', "\"${buildDateTag}${buildVersionTag}-${buildDailySeq}\""
        buildConfigField 'int', 'BW_DIAG_SCHEMA', '1'
        
    }

    // CI 固定签名：当注入 BASTION_KS_FILE 时，debug 与 release 共用同一 keystore，
    // 使 preview debug APK 与 stable release APK 签名一致，可互相覆盖安装。
    // 本地开发不设这些环境变量，仍走 Android 默认 debug keystore，无副作用。
    signingConfigs {
        ciFixed {
            storeFile file(System.env.BASTION_KS_FILE ?: 'nonexistent.jks')
            storePassword System.env.BASTION_KS_STORE_PASSWORD ?: ''
            keyAlias System.env.BASTION_KS_ALIAS ?: ''
            keyPassword System.env.BASTION_KS_KEY_PASSWORD ?: ''
        }
    }

    splits {
        abi {
            // 仅输出 arm64-v8a（64 位）APK，砍掉 armeabi-v7a（32 位）以缩短构建并精简产物。
            // 现代设备几乎均为 64 位；仅极少数老旧 32 位设备不再支持。
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        release {
            // 默认开启混淆与资源压缩（Stable 正式构建走此路径）。
            // CI 的 Preview 构建通过 -PpreviewMinify=false 关闭混淆以大幅加速，
            // 不影响发布产物的安全性与体积。
            def disableMinify = project.findProperty('previewMinify')?.toString()?.trim()?.equalsIgnoreCase('false')
            minifyEnabled !disableMinify
            shrinkResources !disableMinify
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            // CI 注入固定 keystore 时启用，确保 debug APK 与 stable release APK 签名一致可互相覆盖
            if (System.env.BASTION_KS_FILE != null) {
                signingConfig signingConfigs.ciFixed
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }


    // Phase A（AGP 9）：applicationVariants / libraryVariants / testVariants / unitTestVariants
    // 等旧 variant 扩展点已被 AGP 9 移除（见 AGP 9.0 发行说明），上面的 APK 输出文件名
    // 自定义重命名逻辑因此失效。AGP 9 下不能在 onVariants 里直接写 outputFileName
    // （新 VariantOutput 仅暴露 versionCode/versionName/outputType），官方推荐的「重命名 APK」
    // 方式是 androidComponents + SingleArtifact.APK 的 listenToArtifacts 机制（自定义 Copy
    // 任务 + BuiltArtifacts 元数据）。为尽快让构建门进入真正的编译阶段并产出可真机验证的
    // preview 包，此处先移除失效块，自定义命名（Bastion-Android-*.APK）留作后续用正确方式还原，
    // 还原方案见仓库 /doc/phaseA-apk-rename-restore.md。CI 的 APK 收集通配符（*.apk/*.APK）
    // 对默认命名 app-arm64-v8a-debug.apk 同样生效，不影响出包与发布。

    sourceSets {
        test {
            java {
                // Legacy autofill tests target removed APIs and currently block unit-test compilation.
                // Keep them isolated until the Autofill test suite is rebuilt against current architecture.
                exclude 'com/bastion/app/autofill/**'
            }
        }
    }
    lint {
        baseline = file('lint-baseline.xml')
        // Workaround: lint/lifecycle detector crashes with Kotlin 2.x analysis API in current toolchain.
        disable 'NullSafeMutableLiveData',
                'FrequentlyChangingValue',
                'RememberInComposition',
                'FlowOperatorInvokedInComposition',
                'UnrememberedMutableState',
                'AutoboxingStateCreation',
                'CoroutineCreationDuringComposition',
                'StateFlowValueCalledInComposition',
                'ProduceStateDoesNotAssignValue',
                'MissingTranslation'
        // Avoid scanning dependency-provided lint registries; one of them intermittently
        // crashes ASM migration with NegativeArraySizeException in lintVitalAnalyzeRelease.
        checkDependencies false
        // lintVital still loads dependency registries even when checkDependencies is false.
        // Disable the broken release gate so Android Studio's normal assembleRelease works.
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

// Phase A（AGP 9 内置 Kotlin）：kotlin extension 由 AGP 9 内置提供，
// 编译器选项与 Compose 编译器报告在此顶层 kotlin {} 块配置。
kotlin {
    compilerOptions {
        // Kotlin 2.2：compilerOptions.jvmTarget 要求 JvmTarget 枚举，
        // 不再接受 Gradle 的 JavaVersion（否则报 Cannot convert ... JavaVersion to JvmTarget）
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
    // 架构升级 C.6（第 1 步）：开启 Compose 编译器稳定性/指标报告。
    // 报告输出到 app/build/compose_compiler/，用于定位被误判为「不稳定」的数据类，
    // 后续可针对性地添加 @Immutable / @Stable 注解以减少不必要重组。
    // 仅生成报告，不改变编译行为，不影响产物。
    composeCompiler {
        reportsDestination = layout.buildDirectory.dir("compose_compiler")
    }
}

configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-bom:2.3.21",
        "org.jetbrains.kotlin:kotlin-stdlib:2.3.21",
        "org.jetbrains.kotlin:kotlin-stdlib-common:2.3.21",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.21",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21",
        "org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1",
        "org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1",
        "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1",
        "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1",
        "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.8.1"
    )
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1")
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
    }

    // Core Android libraries
    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.splashscreen  // 添加splashscreen依赖
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"
    implementation libs.androidx.activity.compose
    // Pin profileinstaller to the latest stable patch and avoid older transitive copies.
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    // 阶段二·稳定性：原计划在 debug 引入 LeakCanary 捕获内存泄漏，但 2.14 在 Android 17(API 37)
    // 进程启动期(ContentProvider 自启)崩溃导致预览版无法启动，已回退。
    // 经核查官方仓库：LeakCanary 无稳定版 3.0，最新仅为 v3.0-alpha-9（alpha）。要支持 Android 17
    // 只能上 alpha 版，属重点决定，待用户确认后再接入（见 doc/android17-perf-optimization.md #9）。
    // debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
    
    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material3.window.size
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.animation:animation-graphics"
    
    // Navigation
    implementation libs.androidx.navigation.compose
    
    // Room Database
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    
    // Biometric
    implementation libs.androidx.biometric
    
    // Security
    implementation libs.androidx.security.crypto
    
    // ViewModel
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    
    // Coroutines
    implementation libs.kotlin.coroutines.android
    
    // Material Icons Extended
    implementation libs.androidx.material.icons.extended
    
    // Fragment and Material Components (for BottomSheet)
    implementation libs.androidx.fragment.ktx
    implementation libs.material
    
    // Autofill and Slice (for InlinePresentation)
    implementation libs.androidx.autofill
    implementation libs.androidx.slice.core
    implementation libs.androidx.slice.builders
    
    // Credentials API (for Passkey support, Android 14+)
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    
    // Google Play Services Auth (for SMS Retriever API - OTP auto-read)
    implementation libs.play.services.auth
    
    // DataStore
    implementation libs.androidx.datastore.preferences
    
    // TOTP and QR Code
    implementation libs.zxing.core
    implementation libs.zxing.android.embedded
    // 扫码统一走 zxing（zxing.android.embedded + zxing.core），不再依赖 mlkit
    // 的 Vision 原生库，以缩减原生库体积。
    
    // Camera
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    
    // Permissions
    implementation libs.accompanist.permissions
    implementation libs.accompanist.drawablepainter
    
    // Kotlinx Serialization
    implementation libs.kotlinx.serialization.json
    
    // WebDAV for cloud backup
    implementation 'com.github.thegrizzlylabs:sardine-android:0.8'
    
    // KeePass KDBX library for KeePass compatibility
    // 0.10.0 is the newest release compatible with the project's Kotlin 1.9 toolchain.
    implementation 'app.keemobile:kotpass:0.10.0'
    
    // WorkManager for auto backup
    implementation libs.androidx.work.runtime.ktx

    // Reorderable for drag-and-drop sorting
    implementation libs.reorderable

    // Markdown rendering
    implementation libs.commonmark
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.22.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.22.0'
    
    // Charts for ledger analytics
    // TODO: Re-enable after resolving Kotlin version compatibility
    // implementation libs.vico.compose.m3
    
    // Scrypt for Aegis decryption
    implementation libs.scrypt

    // Password strength analysis, same engine used by Keyguard
    implementation 'com.nulab-inc:zxcvbn:1.9.0'
    
    // ==== Bitwarden Integration ====
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    
    // OkHttp for networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'

    // Microsoft identity platform / OneDrive auth
    implementation 'com.microsoft.identity.client:msal:8.3.2'
    implementation 'com.squareup.moshi:moshi-adapters:1.15.1'
    
    // BouncyCastle for Argon2 (Bitwarden KDF support)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // Native Argon2 backend for Bitwarden Argon2id KDF. This keeps high-memory
    // KDF work off the Android JVM heap.
    implementation('com.lambdapioneer.argon2kt:argon2kt:1.6.0') {
        exclude group: 'androidx.appcompat', module: 'appcompat'
        exclude group: 'androidx.core', module: 'core-ktx'
    }

    // Brand icon loading now uses remote PNG assets from Stratum Auth app
    
    // Testing
    testImplementation libs.junit
    testImplementation libs.kotlin.coroutines.test
    // 仅单元测试 classpath，不进 APK。用于给 PasswordViewModel 的有状态编排
    // （删除/归档/跨存储迁移）补行为测试——这些路径此前零守卫覆盖。
    testImplementation libs.mockk
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}

