# 强制英文 locale：jpackage/WiX 在 zh-CN 区域下生成 MSI 会失败（light.exe exit 216）。
# 同时保证 jpackage 以 UTF-8 读取 args 文件，避免中文 description 编码错误。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
# 禁用 Gradle 构建缓存：代码频繁变更时 build cache 会恢复旧产物导致编译失败
org.gradle.caching=false
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.code.style=official
