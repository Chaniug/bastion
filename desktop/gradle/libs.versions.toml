[versions]
kotlin = "2.3.21"
# 刻意保留 1.10.3：Compose Multiplatform 与 Kotlin 版本强绑定，而 1.12.0 是
# 2026-08-25 刚发布（距本次升级仅 4 天），1.11.1 也只稳定了 3 个月。
# 桌面端目前是次要模块（Phase 5 三 Tab UI 仍在完善），不值得为它引入
# Kotlin/Compose 版本绑定的不确定性。待 1.12 线稳定后再单独升。
compose = "1.10.3"
composeCompiler = "2.3.21"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
sqldelight = "2.3.2"
# 必须与 app 模块保持同一个 kotpass 版本：desktop/shared 与 app 共享 KDBX 代码
# （KeePassKdbxService 的 public API 暴露了 kotpass 类型），版本不一致会导致
# 两端对同一份 KDBX 的解析行为分叉。
kotpass = "0.13.0"
bouncycastle = "1.85.2"
retrofit = "3.0.0"
okhttp = "5.5.0"
jna = "5.19.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-javafx = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-javafx", version.ref = "kotlinxCoroutines" }

# SQLDelight
sqldelight-jvm-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# KeePass / crypto
kotpass = { module = "app.keemobile:kotpass", version.ref = "kotpass" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# HTTP
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Windows DPAPI
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
